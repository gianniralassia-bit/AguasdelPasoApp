<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Aguas Del Paso</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230284c7'/%3E%3Cpath d='M50 18 C38 35 30 48 30 58 C30 70 38 78 50 78 C62 78 70 70 70 58 C70 48 62 35 50 18Z' fill='white'/%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0284c7',
              'blue-dark': '#0369a1',
              'blue-light': '#e0f2fe',
              orange: '#f97316',
              'orange-dark': '#ea580c',
              'orange-light': '#ffedd5',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior: none; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .splash { animation: fadeOut 0.5s ease-in-out 2.2s forwards; }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    .status-pendiente { background: #fef3c7; color: #92400e; }
    .status-en-reparto { background: #dbeafe; color: #1e40af; }
    .status-entregado { background: #d1fae5; color: #065f46; }
    .status-cancelado { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ==================== UTILITIES ====================
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    const today = () => new Date().toISOString().slice(0, 10);
    const formatDate = (d) => {
      if (!d) return '';
      const [y, m, day] = d.split('-');
      return `${day}/${m}/${y}`;
    };
    const formatMoney = (n) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(n || 0);

    // ==================== STORAGE ====================
    const DB_KEY = 'aguas_del_paso_v1';
    const defaultData = {
      repartidores: [
        { id: 'r1', nombre: 'Juan Pérez', telefono: '', foto: '', vehiculoId: 'v1' }
      ],
      vehiculos: [
        { id: 'v1', marca: 'Fiat', modelo: 'Fiorino', patente: 'ABC 123', anio: 2019, tipo: 'Utilitario', repartidorHabitualId: 'r1', estado: 'Activo' }
      ],
      clientes: [],
      pedidos: [],
      dispensers: [],
      alquileres: [],
      precios: { bidon: 2500, alquilerBase: 15000 }
    };

    function loadDB() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (raw) return { ...defaultData, ...JSON.parse(raw) };
      } catch (e) {}
      return structuredClone(defaultData);
    }
    function saveDB(data) {
      localStorage.setItem(DB_KEY, JSON.stringify(data));
    }

    // ==================== ICONS (simple SVG) ====================
    const Icon = ({ name, size = 24, className = '' }) => {
      const icons = {
        home: <><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
        truck: <><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>,
        users: <><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
        droplet: <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>,
        more: <><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></>,
        plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
        search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
        chevron: <polyline points="9 18 15 12 9 6"/>,
        check: <polyline points="20 6 9 17 4 12"/>,
        x: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
        edit: <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
        calendar: <><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>,
        phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>,
        map: <><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></>,
        package: <><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>,
        dollar: <><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>,
        back: <><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
        trash: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>,
        settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {icons[name] || icons.home}
        </svg>
      );
    };

    // ==================== LOGO ====================
    const Logo = ({ size = 'md', className = '' }) => {
      const sizes = { sm: 'w-10 h-10', md: 'w-16 h-16', lg: 'w-28 h-28', xl: 'w-36 h-36' };
      return (
        <div className={`${sizes[size]} ${className} relative flex items-center justify-center`}>
          <div className="absolute inset-0 rounded-full bg-gradient-to-br from-sky-400 to-brand-blue shadow-lg"></div>
          <div className="absolute inset-1 rounded-full bg-white flex items-center justify-center">
            <svg viewBox="0 0 64 64" className="w-3/4 h-3/4">
              <path d="M32 8 C22 22 16 32 16 40 C16 50 23 56 32 56 C41 56 48 50 48 40 C48 32 42 22 32 8Z" fill="#0284c7"/>
              <path d="M32 14 C26 24 22 32 22 38 C22 45 26 50 32 50 C38 50 42 45 42 38 C42 32 38 24 32 14Z" fill="#38bdf8" opacity="0.7"/>
              <circle cx="28" cy="36" r="3" fill="white" opacity="0.6"/>
            </svg>
          </div>
          <div className="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-brand-orange border-2 border-white flex items-center justify-center text-[10px] font-bold text-white">+</div>
        </div>
      );
    };

    // ==================== COMPONENTS ====================
    const Badge = ({ status }) => {
      const map = {
        'Pendiente': 'status-pendiente',
        'En reparto': 'status-en-reparto',
        'Entregado': 'status-entregado',
        'Cancelado': 'status-cancelado'
      };
      return <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${map[status] || 'bg-slate-100'}`}>{status}</span>;
    };

    const BottomNav = ({ tab, setTab }) => {
      const items = [
        { id: 'inicio', label: 'Inicio', icon: 'home' },
        { id: 'repartos', label: 'Repartos', icon: 'truck' },
        { id: 'clientes', label: 'Clientes', icon: 'users' },
        { id: 'dispensers', label: 'Dispensers', icon: 'droplet' },
        { id: 'mas', label: 'Más', icon: 'more' },
      ];
      return (
        <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 safe-bottom z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
          <div className="flex justify-around items-center h-16 max-w-lg mx-auto">
            {items.map(item => (
              <button key={item.id} onClick={() => setTab(item.id)}
                className={`flex flex-col items-center justify-center flex-1 h-full gap-0.5 transition-colors ${tab === item.id ? 'text-brand-blue' : 'text-slate-400'}`}>
                <Icon name={item.icon} size={22} />
                <span className="text-[11px] font-medium">{item.label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    };

    const Header = ({ title, onBack, right }) => (
      <header className="sticky top-0 z-30 bg-brand-blue text-white px-4 py-3 flex items-center gap-3 shadow-md">
        {onBack && (
          <button onClick={onBack} className="p-1 -ml-1 rounded-full hover:bg-white/20">
            <Icon name="back" size={22} />
          </button>
        )}
        <h1 className="text-lg font-bold flex-1 truncate">{title}</h1>
        {right}
      </header>
    );

    const Card = ({ children, className = '', onClick }) => (
      <div onClick={onClick} className={`bg-white rounded-2xl shadow-sm border border-slate-100 p-4 ${onClick ? 'active:scale-[0.98] transition-transform cursor-pointer' : ''} ${className}`}>
        {children}
      </div>
    );

    const Button = ({ children, variant = 'primary', className = '', onClick, disabled, size = 'md' }) => {
      const base = 'font-semibold rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 disabled:opacity-50';
      const sizes = { sm: 'px-3 py-2 text-sm', md: 'px-4 py-3 text-base', lg: 'px-6 py-4 text-lg' };
      const variants = {
        primary: 'bg-brand-blue text-white shadow-md shadow-sky-200',
        orange: 'bg-brand-orange text-white shadow-md shadow-orange-200',
        outline: 'border-2 border-brand-blue text-brand-blue bg-white',
        ghost: 'text-slate-600 bg-slate-100',
        danger: 'bg-red-500 text-white'
      };
      return (
        <button onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
          {children}
        </button>
      );
    };

    const Input = ({ label, ...props }) => (
      <div className="mb-3">
        {label && <label className="block text-sm font-medium text-slate-600 mb-1">{label}</label>}
        <input className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-brand-blue/40 focus:border-brand-blue text-base" {...props} />
      </div>
    );

    const Select = ({ label, children, ...props }) => (
      <div className="mb-3">
        {label && <label className="block text-sm font-medium text-slate-600 mb-1">{label}</label>}
        <select className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-brand-blue/40 text-base appearance-none" {...props}>
          {children}
        </select>
      </div>
    );

    const Textarea = ({ label, ...props }) => (
      <div className="mb-3">
        {label && <label className="block text-sm font-medium text-slate-600 mb-1">{label}</label>}
        <textarea className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-brand-blue/40 text-base resize-none" rows={3} {...props} />
      </div>
    );

    // ==================== SCREENS ====================
    function Splash({ onDone }) {
      useEffect(() => {
        const t = setTimeout(onDone, 2500);
        return () => clearTimeout(t);
      }, [onDone]);
      return (
        <div className="splash fixed inset-0 z-50 bg-gradient-to-b from-sky-400 to-brand-blue flex flex-col items-center justify-center">
          <Logo size="xl" className="mb-6 animate-pulse" />
          <h1 className="text-white text-3xl font-bold tracking-wide">Aguas Del Paso</h1>
          <p className="text-sky-100 mt-2 text-sm">Gestión de repartos</p>
        </div>
      );
    }

    function Dashboard({ db, setTab, onNewPedido, onSearch }) {
      const hoy = today();
      const pedidosHoy = db.pedidos.filter(p => p.fecha === hoy);
      const pendientes = pedidosHoy.filter(p => p.estado === 'Pendiente' || p.estado === 'En reparto');
      const entregados = pedidosHoy.filter(p => p.estado === 'Entregado');
      const bidones = pedidosHoy.reduce((s, p) => s + (p.cantidad || 0), 0);
      const efectivo = pedidosHoy.filter(p => p.formaPago === 'Efectivo' && p.estado === 'Entregado').reduce((s, p) => s + (p.cantidad * (db.precios?.bidon || 2500)), 0);
      const transferencias = pedidosHoy.filter(p => p.formaPago === 'Transferencia' && p.estado === 'Entregado').reduce((s, p) => s + (p.cantidad * (db.precios?.bidon || 2500)), 0);
      const transPendientes = pedidosHoy.filter(p => p.formaPago === 'Transferencia' && !p.transferenciaAcreditada && p.estado !== 'Cancelado').length;
      const deudas = db.clientes.filter(c => (c.deuda || 0) > 0).length;
      const envasesPend = db.clientes.filter(c => (c.envasesPendientes || 0) > 0).length;

      return (
        <div className="pb-24">
          <div className="bg-gradient-to-br from-brand-blue to-sky-600 text-white px-5 pt-8 pb-6 rounded-b-3xl shadow-lg">
            <div className="flex items-center gap-3 mb-6">
              <Logo size="sm" />
              <div>
                <h1 className="text-xl font-bold">Aguas Del Paso</h1>
                <p className="text-sky-100 text-sm">{formatDate(hoy)}</p>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div className="bg-white/15 backdrop-blur rounded-2xl p-3">
                <div className="text-2xl font-bold">{pedidosHoy.length}</div>
                <div className="text-xs text-sky-100">Pedidos hoy</div>
              </div>
              <div className="bg-white/15 backdrop-blur rounded-2xl p-3">
                <div className="text-2xl font-bold">{bidones}</div>
                <div className="text-xs text-sky-100">Bidones</div>
              </div>
              <div className="bg-white/15 backdrop-blur rounded-2xl p-3">
                <div className="text-lg font-bold">{formatMoney(efectivo)}</div>
                <div className="text-xs text-sky-100">Efectivo</div>
              </div>
              <div className="bg-white/15 backdrop-blur rounded-2xl p-3">
                <div className="text-lg font-bold">{formatMoney(transferencias)}</div>
                <div className="text-xs text-sky-100">Transferencias</div>
              </div>
            </div>
          </div>

          <div className="px-4 -mt-4">
            <button onClick={onNewPedido} className="w-full bg-brand-orange text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-orange-200 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
              <Icon name="plus" size={24} /> NUEVO PEDIDO
            </button>
          </div>

          <div className="px-4 mt-5 space-y-3">
            <div className="relative">
              <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" size={18} /></div>
              <input onFocus={onSearch} placeholder="Buscar cliente..." className="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 bg-white text-base" readOnly />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Card className="!p-3">
                <div className="text-2xl font-bold text-amber-600">{pendientes.length}</div>
                <div className="text-xs text-slate-500">Pendientes</div>
              </Card>
              <Card className="!p-3">
                <div className="text-2xl font-bold text-emerald-600">{entregados.length}</div>
                <div className="text-xs text-slate-500">Entregados</div>
              </Card>
              <Card className="!p-3">
                <div className="text-2xl font-bold text-blue-600">{transPendientes}</div>
                <div className="text-xs text-slate-500">Transf. a acreditar</div>
              </Card>
              <Card className="!p-3">
                <div className="text-2xl font-bold text-red-500">{deudas}</div>
                <div className="text-xs text-slate-500">Con deuda</div>
              </Card>
            </div>

            {envasesPend > 0 && (
              <Card className="bg-orange-50 border-orange-100">
                <div className="flex items-center gap-2 text-brand-orange-dark">
                  <Icon name="package" size={20} />
                  <span className="font-medium">{envasesPend} clientes deben envases</span>
                </div>
              </Card>
            )}
          </div>
        </div>
      );
    }

    function RepartosScreen({ db, setDb, fecha, setFecha, onEditPedido }) {
      const pedidos = db.pedidos.filter(p => p.fecha === fecha).sort((a, b) => (a.estado === 'Pendiente' ? -1 : 1));
      const clientesMap = Object.fromEntries(db.clientes.map(c => [c.id, c]));
      const repartidoresMap = Object.fromEntries(db.repartidores.map(r => [r.id, r]));
      const vehiculosMap = Object.fromEntries(db.vehiculos.map(v => [v.id, v]));

      const cambiarEstado = (id, nuevo) => {
        const nuevos = db.pedidos.map(p => p.id === id ? { ...p, estado: nuevo } : p);
        const next = { ...db, pedidos: nuevos };
        setDb(next); saveDB(next);
      };

      return (
        <div className="pb-24">
          <Header title="Reparto del día" />
          <div className="px-4 py-3 bg-white border-b flex items-center gap-3">
            <input type="date" value={fecha} onChange={e => setFecha(e.target.value)}
              className="flex-1 px-3 py-2 rounded-lg border border-slate-200 text-base" />
            <Button size="sm" variant="ghost" onClick={() => setFecha(today())}>Hoy</Button>
          </div>
          <div className="px-4 py-3 space-y-3">
            {pedidos.length === 0 ? (
              <div className="text-center py-12 text-slate-400">
                <Icon name="truck" size={48} className="mx-auto mb-3 opacity-40" />
                <p>No hay pedidos para esta fecha</p>
              </div>
            ) : pedidos.map(p => {
              const cli = clientesMap[p.clienteId];
              return (
                <Card key={p.id} onClick={() => onEditPedido(p)}>
                  <div className="flex justify-between items-start mb-2">
                    <div>
                      <div className="font-bold text-base">{cli?.nombre || 'Cliente'}</div>
                      <div className="text-sm text-slate-500">{cli?.barrio} · {cli?.direccion}</div>
                    </div>
                    <Badge status={p.estado} />
                  </div>
                  <div className="flex flex-wrap gap-2 text-sm mt-2">
                    <span className="bg-sky-50 text-brand-blue px-2 py-0.5 rounded-lg font-medium">{p.cantidad} bidones</span>
                    <span className="bg-slate-50 px-2 py-0.5 rounded-lg">{p.formaPago}</span>
                    {p.formaPago === 'Transferencia' && (
                      <span className={`px-2 py-0.5 rounded-lg ${p.transferenciaAcreditada ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>
                        {p.transferenciaAcreditada ? '✓ Acreditada' : '⏳ Pendiente'}
                      </span>
                    )}
                  </div>
                  {p.estado !== 'Entregado' && p.estado !== 'Cancelado' && (
                    <div className="flex gap-2 mt-3">
                      {p.estado === 'Pendiente' && (
                        <Button size="sm" variant="outline" className="flex-1" onClick={(e) => { e.stopPropagation(); cambiarEstado(p.id, 'En reparto'); }}>
                          En reparto
                        </Button>
                      )}
                      <Button size="sm" variant="primary" className="flex-1" onClick={(e) => { e.stopPropagation(); cambiarEstado(p.id, 'Entregado'); }}>
                        Entregar
                      </Button>
                    </div>
                  )}
                </Card>
              );
            })}
          </div>
        </div>
      );
    }

    function ClientesScreen({ db, setDb, onSelectCliente, onNewCliente }) {
      const [q, setQ] = useState('');
      const filtrados = useMemo(() => {
        const term = q.toLowerCase().trim();
        if (!term) return db.clientes;
        return db.clientes.filter(c =>
          (c.nombre || '').toLowerCase().includes(term) ||
          (c.telefono || '').includes(term) ||
          (c.direccion || '').toLowerCase().includes(term) ||
          (c.barrio || '').toLowerCase().includes(term)
        );
      }, [db.clientes, q]);

      return (
        <div className="pb-24">
          <Header title="Clientes" right={
            <button onClick={onNewCliente} className="p-2 rounded-full bg-white/20"><Icon name="plus" size={20} /></button>
          } />
          <div className="px-4 py-3">
            <div className="relative mb-3">
              <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" size={18} /></div>
              <input value={q} onChange={e => setQ(e.target.value)} placeholder="Nombre, teléfono, barrio..."
                className="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 bg-white text-base" />
            </div>
            <div className="space-y-2">
              {filtrados.length === 0 ? (
                <div className="text-center py-12 text-slate-400">
                  <Icon name="users" size={48} className="mx-auto mb-3 opacity-40" />
                  <p>No hay clientes</p>
                  <Button className="mt-4" onClick={onNewCliente}>Agregar cliente</Button>
                </div>
              ) : filtrados.map(c => (
                <Card key={c.id} onClick={() => onSelectCliente(c)}>
                  <div className="flex justify-between items-start">
                    <div>
                      <div className="font-bold">{c.nombre}</div>
                      <div className="text-sm text-slate-500">{c.barrio} · {c.direccion}</div>
                      {c.telefono && <div className="text-sm text-slate-400 mt-0.5">{c.telefono}</div>}
                    </div>
                    <div className="text-right text-sm">
                      {(c.deuda || 0) > 0 && <div className="text-red-500 font-medium">{formatMoney(c.deuda)}</div>}
                      {(c.envasesPendientes || 0) > 0 && <div className="text-orange-600">{c.envasesPendientes} envases</div>}
                      <div className="text-slate-400">{c.cantidadHabitual || 0} bid.</div>
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ClienteDetail({ cliente, db, setDb, onBack, onEdit, onNewPedido }) {
      const historial = db.pedidos.filter(p => p.clienteId === cliente.id).sort((a, b) => b.fecha.localeCompare(a.fecha));
      const precio = db.precios?.bidon || 2500;

      const actualizarEnvases = (entregados, devueltos) => {
        const pend = (cliente.envasesEntregados || 0) + entregados - ((cliente.envasesDevueltos || 0) + devueltos);
        const nextCli = { ...cliente, envasesEntregados: (cliente.envasesEntregados || 0) + entregados, envasesDevueltos: (cliente.envasesDevueltos || 0) + devueltos, envasesPendientes: Math.max(0, pend) };
        const next = { ...db, clientes: db.clientes.map(c => c.id === cliente.id ? nextCli : c) };
        setDb(next); saveDB(next);
      };

      return (
        <div className="pb-24">
          <Header title={cliente.nombre} onBack={onBack} right={
            <button onClick={onEdit} className="p-2 rounded-full bg-white/20"><Icon name="edit" size={18} /></button>
          } />
          <div className="px-4 py-4 space-y-4">
            <Card>
              <div className="space-y-2 text-sm">
                {cliente.telefono && <div className="flex items-center gap-2"><Icon name="phone" size={16} className="text-slate-400" /> {cliente.telefono}</div>}
                <div className="flex items-center gap-2"><Icon name="map" size={16} className="text-slate-400" /> {cliente.direccion}</div>
                <div className="text-slate-500">Barrio: {cliente.barrio}</div>
                <div className="text-slate-500">Habitual: {cliente.cantidadHabitual || 0} bidones</div>
                {cliente.observaciones && <div className="text-slate-500 italic">{cliente.observaciones}</div>}
              </div>
            </Card>

            <div className="grid grid-cols-2 gap-3">
              <Card className="!p-3 text-center">
                <div className={`text-xl font-bold ${(cliente.deuda || 0) > 0 ? 'text-red-500' : 'text-emerald-600'}`}>{formatMoney(cliente.deuda || 0)}</div>
                <div className="text-xs text-slate-500">Deuda</div>
              </Card>
              <Card className="!p-3 text-center">
                <div className="text-xl font-bold text-orange-600">{cliente.envasesPendientes || 0}</div>
                <div className="text-xs text-slate-500">Envases debe</div>
              </Card>
            </div>

            <Card>
              <div className="font-semibold mb-2">Control de envases</div>
              <div className="text-sm text-slate-600 mb-3">
                Entregados: {cliente.envasesEntregados || 0} · Devueltos: {cliente.envasesDevueltos || 0}
              </div>
              <div className="flex gap-2">
                <Button size="sm" variant="outline" className="flex-1" onClick={() => actualizarEnvases(1, 0)}>+1 entregado</Button>
                <Button size="sm" variant="outline" className="flex-1" onClick={() => actualizarEnvases(0, 1)}>+1 devuelto</Button>
              </div>
            </Card>

            <Button variant="orange" className="w-full" onClick={() => onNewPedido(cliente)}>
              <Icon name="plus" size={18} /> Nuevo pedido para este cliente
            </Button>

            <div>
              <h3 className="font-bold text-lg mb-2">Historial</h3>
              {historial.length === 0 ? (
                <p className="text-slate-400 text-sm">Sin pedidos aún</p>
              ) : (
                <div className="space-y-2">
                  {historial.map(p => (
                    <Card key={p.id} className="!p-3">
                      <div className="flex justify-between items-center">
                        <div>
                          <div className="font-medium">{formatDate(p.fecha)} · {p.cantidad} bidones</div>
                          <div className="text-xs text-slate-500">{p.formaPago} {p.transferenciaAcreditada ? '✓' : ''} · {formatMoney(p.cantidad * precio)}</div>
                        </div>
                        <Badge status={p.estado} />
                      </div>
                    </Card>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>

    function NuevoPedidoModal({ db, setDb, onClose, clientePreseleccionado, pedidoEditar }) {
      const [clienteId, setClienteId] = useState(pedidoEditar?.clienteId || clientePreseleccionado?.id || '');
      const [cantidad, setCantidad] = useState(pedidoEditar?.cantidad || clientePreseleccionado?.cantidadHabitual || 2);
      const [formaPago, setFormaPago] = useState(pedidoEditar?.formaPago || 'Efectivo');
      const [estado, setEstado] = useState(pedidoEditar?.estado || 'Pendiente');
      const [acreditada, setAcreditada] = useState(pedidoEditar?.transferenciaAcreditada || false);
      const [obs, setObs] = useState(pedidoEditar?.observaciones || '');
      const [repartidorId, setRepartidorId] = useState(pedidoEditar?.repartidorId || db.repartidores[0]?.id || '');
      const [vehiculoId, setVehiculoId] = useState(pedidoEditar?.vehiculoId || db.vehiculos[0]?.id || '');
      const [fecha, setFecha] = useState(pedidoEditar?.fecha || today());
      const [busqueda, setBusqueda] = useState('');

      const clientesFiltrados = useMemo(() => {
        if (!busqueda) return db.clientes.slice(0, 8);
        const t = busqueda.toLowerCase();
        return db.clientes.filter(c => c.nombre.toLowerCase().includes(t) || (c.telefono || '').includes(t)).slice(0, 8);
      }, [db.clientes, busqueda]);

      const clienteSel = db.clientes.find(c => c.id === clienteId);

      const guardar = () => {
        if (!clienteId || !cantidad) return alert('Seleccioná cliente y cantidad');
        const pedido = {
          id: pedidoEditar?.id || uid(),
          fecha,
          clienteId,
          cantidad: Number(cantidad),
          formaPago,
          estado,
          transferenciaAcreditada: formaPago === 'Transferencia' ? acreditada : false,
          observaciones: obs,
          repartidorId,
          vehiculoId,
          precioUnitario: db.precios?.bidon || 2500
        };
        let pedidos;
        if (pedidoEditar) {
          pedidos = db.pedidos.map(p => p.id === pedido.id ? pedido : p);
        } else {
          pedidos = [...db.pedidos, pedido];
        }
        // Actualizar envases si se entrega
        let clientes = db.clientes;
        if (estado === 'Entregado' && (!pedidoEditar || pedidoEditar.estado !== 'Entregado')) {
          clientes = db.clientes.map(c => {
            if (c.id !== clienteId) return c;
            const ent = (c.envasesEntregados || 0) + Number(cantidad);
            const pend = ent - (c.envasesDevueltos || 0);
            return { ...c, envasesEntregados: ent, envasesPendientes: Math.max(0, pend) };
          });
        }
        const next = { ...db, pedidos, clientes };
        setDb(next); saveDB(next);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center">
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[92vh] overflow-y-auto">
            <div className="sticky top-0 bg-white px-4 py-3 border-b flex justify-between items-center">
              <h2 className="text-lg font-bold">{pedidoEditar ? 'Editar pedido' : 'Nuevo pedido'}</h2>
              <button onClick={onClose} className="p-2"><Icon name="x" size={22} /></button>
            </div>
            <div className="p-4 space-y-1">
              {!clientePreseleccionado && !pedidoEditar && (
                <>
                  <Input label="Buscar cliente" value={busqueda} onChange={e => setBusqueda(e.target.value)} placeholder="Nombre o teléfono" />
                  {busqueda && (
                    <div className="mb-3 max-h-40 overflow-y-auto border rounded-xl">
                      {clientesFiltrados.map(c => (
                        <button key={c.id} onClick={() => { setClienteId(c.id); setBusqueda(''); setCantidad(c.cantidadHabitual || 2); }}
                          className={`w-full text-left px-3 py-2 border-b last:border-0 ${clienteId === c.id ? 'bg-sky-50' : ''}`}>
                          <div className="font-medium">{c.nombre}</div>
                          <div className="text-xs text-slate-500">{c.barrio}</div>
                        </button>
                      ))}
                    </div>
                  )}
                </>
              )}
              {clienteSel && (
                <div className="bg-sky-50 rounded-xl p-3 mb-3">
                  <div className="font-bold">{clienteSel.nombre}</div>
                  <div className="text-sm text-slate-600">{clienteSel.direccion} · {clienteSel.barrio}</div>
                </div>
              )}
              <Input label="Fecha" type="date" value={fecha} onChange={e => setFecha(e.target.value)} />
              <Input label="Cantidad de bidones" type="number" min="1" value={cantidad} onChange={e => setCantidad(e.target.value)} />
              <Select label="Forma de pago" value={formaPago} onChange={e => setFormaPago(e.target.value)}>
                <option value="Efectivo">Efectivo</option>
                <option value="Transferencia">Transferencia</option>
              </Select>
              {formaPago === 'Transferencia' && (
                <label className="flex items-center gap-3 mb-3 p-3 bg-amber-50 rounded-xl">
                  <input type="checkbox" checked={acreditada} onChange={e => setAcreditada(e.target.checked)} className="w-5 h-5 rounded" />
                  <span className="font-medium">Transferencia acreditada</span>
                </label>
              )}
              <Select label="Estado" value={estado} onChange={e => setEstado(e.target.value)}>
                <option>Pendiente</option>
                <option>En reparto</option>
                <option>Entregado</option>
                <option>Cancelado</option>
              </Select>
              <Select label="Repartidor" value={repartidorId} onChange={e => setRepartidorId(e.target.value)}>
                {db.repartidores.map(r => <option key={r.id} value={r.id}>{r.nombre}</option>)}
              </Select>
              <Select label="Vehículo" value={vehiculoId} onChange={e => setVehiculoId(e.target.value)}>
                {db.vehiculos.map(v => <option key={v.id} value={v.id}>{v.marca} {v.modelo} ({v.patente})</option>)}
              </Select>
              <Textarea label="Observaciones" value={obs} onChange={e => setObs(e.target.value)} />
              <Button className="w-full mt-2" onClick={guardar}>{pedidoEditar ? 'Guardar cambios' : 'Crear pedido'}</Button>
            </div>
          </div>
        </div>
      );
    }

    function NuevoClienteModal({ db, setDb, onClose, clienteEditar }) {
      const [form, setForm] = useState(clienteEditar || {
        nombre: '', telefono: '', direccion: '', barrio: '', cantidadHabitual: 2, observaciones: '', deuda: 0,
        envasesEntregados: 0, envasesDevueltos: 0, envasesPendientes: 0
      });
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const guardar = () => {
        if (!form.nombre.trim()) return alert('Nombre obligatorio');
        const cli = { ...form, id: clienteEditar?.id || uid(), envasesPendientes: Math.max(0, (form.envasesEntregados || 0) - (form.envasesDevueltos || 0)) };
        let clientes;
        if (clienteEditar) {
          clientes = db.clientes.map(c => c.id === cli.id ? cli : c);
        } else {
          clientes = [...db.clientes, cli];
        }
        const next = { ...db, clientes };
        setDb(next); saveDB(next);
        onClose(cli);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center">
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[92vh] overflow-y-auto">
            <div className="sticky top-0 bg-white px-4 py-3 border-b flex justify-between items-center">
              <h2 className="text-lg font-bold">{clienteEditar ? 'Editar cliente' : 'Nuevo cliente'}</h2>
              <button onClick={() => onClose()} className="p-2"><Icon name="x" size={22} /></button>
            </div>
            <div className="p-4">
              <Input label="Nombre y apellido *" value={form.nombre} onChange={e => set('nombre', e.target.value)} />
              <Input label="Teléfono" value={form.telefono} onChange={e => set('telefono', e.target.value)} type="tel" />
              <Input label="Dirección" value={form.direccion} onChange={e => set('direccion', e.target.value)} />
              <Input label="Barrio" value={form.barrio} onChange={e => set('barrio', e.target.value)} />
              <Input label="Cantidad habitual de bidones" type="number" value={form.cantidadHabitual} onChange={e => set('cantidadHabitual', e.target.value)} />
              <Input label="Deuda actual ($)" type="number" value={form.deuda} onChange={e => set('deuda', e.target.value)} />
              <Textarea label="Observaciones" value={form.observaciones} onChange={e => set('observaciones', e.target.value)} />
              <Button className="w-full" onClick={guardar}>Guardar cliente</Button>
            </div>
          </div>
        </div>
      );
    }

    function DispensersScreen({ db, setDb }) {
      const [selected, setSelected] = useState(null);
      const [showNew, setShowNew] = useState(false);
      const [form, setForm] = useState({ nombre: '', telefono: '', direccion: '', barrio: '', dispenserId: '', fechaInicio: today(), precioMensual: db.precios?.alquilerBase || 15000, estado: 'Activo' });

      const guardar = () => {
        if (!form.nombre) return alert('Nombre obligatorio');
        const d = { ...form, id: uid() };
        const next = { ...db, dispensers: [...db.dispensers, d] };
        setDb(next); saveDB(next);
        setShowNew(false);
        setForm({ nombre: '', telefono: '', direccion: '', barrio: '', dispenserId: '', fechaInicio: today(), precioMensual: 15000, estado: 'Activo' });
      };

      if (selected) {
        const alquileres = (db.alquileres || []).filter(a => a.dispenserClienteId === selected.id).sort((a, b) => b.mes.localeCompare(a.mes));
        return (
          <div className="pb-24">
            <Header title={selected.nombre} onBack={() => setSelected(null)} />
            <div className="px-4 py-4 space-y-4">
              <Card>
                <div className="text-sm space-y-1">
                  <div>Dispenser: {selected.dispenserId || '—'}</div>
                  <div>Inicio: {formatDate(selected.fechaInicio)}</div>
                  <div>Alquiler: {formatMoney(selected.precioMensual)}</div>
                  <div>Estado: {selected.estado}</div>
                </div>
              </Card>
              <h3 className="font-bold">Historial mensual</h3>
              {alquileres.length === 0 ? <p className="text-slate-400 text-sm">Sin registros aún</p> : (
                alquileres.map(a => (
                  <Card key={a.id} className="!p-3">
                    <div className="font-medium">{a.mes}</div>
                    <div className="text-sm text-slate-600">Consumo: {a.bidonesConsumidos} · Pagado: {a.pagado ? 'Sí' : 'No'} · {formatMoney(a.monto)}</div>
                  </Card>
                ))
              )}
              <Button className="w-full" onClick={() => {
                const mes = new Date().toISOString().slice(0, 7);
                const alq = { id: uid(), dispenserClienteId: selected.id, mes, monto: selected.precioMensual, bidonesConsumidos: 0, pagado: false, fechaPago: '', formaPago: '', observaciones: '' };
                const next = { ...db, alquileres: [...(db.alquileres || []), alq] };
                setDb(next); saveDB(next);
              }}>+ Registrar mes actual</Button>
            </div>
          </div>
        );
      }

      return (
        <div className="pb-24">
          <Header title="Clientes con Dispenser" right={
            <button onClick={() => setShowNew(true)} className="p-2 rounded-full bg-white/20"><Icon name="plus" size={20} /></button>
          } />
          <div className="px-4 py-3 space-y-2">
            {db.dispensers.length === 0 ? (
              <div className="text-center py-12 text-slate-400">
                <Icon name="droplet" size={48} className="mx-auto mb-3 opacity-40" />
                <p>No hay clientes con dispenser</p>
              </div>
            ) : db.dispensers.map(d => (
              <Card key={d.id} onClick={() => setSelected(d)}>
                <div className="font-bold">{d.nombre}</div>
                <div className="text-sm text-slate-500">{d.barrio} · {formatMoney(d.precioMensual)}/mes</div>
              </Card>
            ))}
          </div>
          {showNew && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-end justify-center">
              <div className="bg-white w-full max-w-lg rounded-t-3xl p-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between mb-4">
                  <h2 className="text-lg font-bold">Nuevo cliente dispenser</h2>
                  <button onClick={() => setShowNew(false)}><Icon name="x" size={22} /></button>
                </div>
                <Input label="Nombre *" value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} />
                <Input label="Teléfono" value={form.telefono} onChange={e => setForm({...form, telefono: e.target.value})} />
                <Input label="Dirección" value={form.direccion} onChange={e => setForm({...form, direccion: e.target.value})} />
                <Input label="Barrio" value={form.barrio} onChange={e => setForm({...form, barrio: e.target.value})} />
                <Input label="ID / N° Dispenser" value={form.dispenserId} onChange={e => setForm({...form, dispenserId: e.target.value})} />
                <Input label="Fecha inicio" type="date" value={form.fechaInicio} onChange={e => setForm({...form, fechaInicio: e.target.value})} />
                <Input label="Precio alquiler mensual" type="number" value={form.precioMensual} onChange={e => setForm({...form, precioMensual: e.target.value})} />
                <Button className="w-full" onClick={guardar}>Guardar</Button>
              </div>
            </div>
          )}
        </div>
      );
    }

              <span className="font-medium">Precios</span>
            </Card>
            <Card onClick={() => {
              if (confirm('¿Exportar todos los datos como JSON?')) {
                const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `aguas-del-paso-backup-${today()}.json`;
                a.click();
              }
            }} className="flex items-center gap-3">
              <Icon name="package" size={22} className="text-brand-blue" />
              <span className="font-medium">Exportar backup</span>
            </Card>
            <Card onClick={() => {
              if (confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')) {
                localStorage.removeItem(DB_KEY);
                setDb(structuredClone(defaultData));
              }
            }} className="flex items-center gap-3 text-red-500">
              <Icon name="trash" size={22} />
              <span className="font-medium">Borrar todos los datos</span>
            </Card>
          </div>
        </div>
      );
    }

    // ==================== APP ====================
    function App() {
      const [splash, setSplash] = useState(true);
      const [db, setDb] = useState(loadDB);
      const [tab, setTab] = useState('inicio');
      const [fechaReparto, setFechaReparto] = useState(today());
      const [showNuevoPedido, setShowNuevoPedido] = useState(false);
      const [showNuevoCliente, setShowNuevoCliente] = useState(false);
      const [clienteSeleccionado, setClienteSeleccionado] = useState(null);
      const [clienteParaPedido, setClienteParaPedido] = useState(null);
      const [pedidoEditar, setPedidoEditar] = useState(null);
      const [showSearch, setShowSearch] = useState(false);

      useEffect(() => { saveDB(db); }, [db]);

      if (splash) return <Splash onDone={() => setSplash(false)} />;

      return (
        <div className="min-h-screen max-w-lg mx-auto bg-slate-50 relative">
          {tab === 'inicio' && !clienteSeleccionado && (
            <Dashboard db={db} setTab={setTab}
              onNewPedido={() => { setClienteParaPedido(null); setPedidoEditar(null); setShowNuevoPedido(true); }}
              onSearch={() => setShowSearch(true)} />
          )}
          {tab === 'repartos' && !clienteSeleccionado && (
            <RepartosScreen db={db} setDb={setDb} fecha={fechaReparto} setFecha={setFechaReparto}
              onEditPedido={(p) => { setPedidoEditar(p); setShowNuevoPedido(true); }} />
          )}
          {tab === 'clientes' && !clienteSeleccionado && (
            <ClientesScreen db={db} setDb={setDb}
              onSelectCliente={setClienteSeleccionado}
              onNewCliente={() => setShowNuevoCliente(true)} />
          )}
          {tab === 'dispensers' && !clienteSeleccionado && (
            <DispensersScreen db={db} setDb={setDb} />
          )}
          {tab === 'mas' && !clienteSeleccionado && (
            <MasScreen db={db} setDb={setDb} />
          )}

          {clienteSeleccionado && (
            <ClienteDetail
              cliente={clienteSeleccionado}
              db={db} setDb={setDb}
              onBack={() => setClienteSeleccionado(null)}
              onEdit={() => { setShowNuevoCliente(true); }}
              onNewPedido={(c) => { setClienteParaPedido(c); setPedidoEditar(null); setShowNuevoPedido(true); }}
            />
          )}

          {showNuevoPedido && (
            <NuevoPedidoModal
              db={db} setDb={setDb}
              onClose={() => { setShowNuevoPedido(false); setPedidoEditar(null); setClienteParaPedido(null); }}
              clientePreseleccionado={clienteParaPedido}
              pedidoEditar={pedidoEditar}
            />
          )}
          {showNuevoCliente && (
            <NuevoClienteModal
              db={db} setDb={setDb}
              clienteEditar={clienteSeleccionado}
              onClose={(cli) => {
                setShowNuevoCliente(false);
                if (cli && !clienteSeleccionado) setClienteSeleccionado(cli);
              }}
            />
          )}

          {showSearch && (
            <div className="fixed inset-0 z-50 bg-white">
              <Header title="Buscar cliente" onBack={() => setShowSearch(false)} />
              <div className="p-4">
                <Input autoFocus placeholder="Nombre, teléfono, barrio..." onChange={e => {
                  // simple inline search handled in ClientesScreen style
                }} />
                <p className="text-sm text-slate-400 mt-4">Escribí y seleccioná un cliente de la lista de Clientes, o usá la pestaña Clientes.</p>
                <Button className="w-full mt-4" onClick={() => { setShowSearch(false); setTab('clientes'); }}>Ir a Clientes</Button>
              </div>
            </div>
          )}

          {!clienteSeleccionado && <BottomNav tab={tab} setTab={setTab} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
