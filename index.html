<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0ea5e9"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Aguas Del Paso</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="logo.jpg"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{blue:'#0284c7','blue-dark':'#0369a1',orange:'#f97316','orange-dark':'#ea580c'}}}}}</script>
<style>
*{ -webkit-tap-highlight-color:transparent } body{overscroll-behavior:none}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom,0)}
.splash{animation:fadeOut .5s ease-in-out 2.2s forwards}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulseSoft{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.status-pendiente{background:#fef3c7;color:#92400e}
.status-en-reparto{background:#dbeafe;color:#1e40af}
.status-entregado{background:#d1fae5;color:#065f46}
.status-cancelado{background:#fee2e2;color:#991b1b}
.card-live{animation:fadeUp .35s ease both;transition:transform .25s ease,box-shadow .25s ease,opacity .25s ease}
.drop-line{height:6px;border-radius:99px;background:linear-gradient(90deg,#0284c7,#f97316);margin:2px 0 10px;animation:pulseSoft .8s ease-in-out infinite}
.handle-grip{animation:pulseSoft 1.8s ease-in-out infinite}
.chip{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.stat-box{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">

const {useState,useEffect,useMemo,useRef}=React;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const mesAR=()=>today().slice(0,7);
const MESES_ES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const formatFechaLarga=d=>{if(!d)return'';const[y,m,day]=d.split('-');return`${Number(day)} de ${MESES_ES[Number(m)-1]} de ${y}`};
const formatMes=ym=>{if(!ym)return'';const[y,m]=ym.split('-');return`${MESES_ES[Number(m)-1]||m} ${y}`};
const mesesCercanos=()=>{const out=[];const now=new Date();for(let i=-6;i<=2;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`)}return out};
const formatMoney=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
const esVentaPlata=p=>p.formaPago!=='Dispenser'&&p.tipoPrecio!=='cero';
const precioDePedido=(p,db)=>{if(p?.tipoPrecio==='cero'||p?.tipoPrecio==='gratis')return 0;if(p?.tipoPrecio==='mayorista')return Number(p.precioUnitario??db.precios?.bidonMayorista??0);return Number(p.precioUnitario??db.precios?.bidon??2500)};
const DB_KEY='aguas_del_paso_v1';
const defaultData={repartidores:[{id:'r1',nombre:'Juan Pérez',telefono:'',vehiculoId:'v1'}],vehiculos:[{id:'v1',marca:'Fiat',modelo:'Fiorino',patente:'ABC 123',anio:2019,estado:'Activo'}],clientes:[],pedidos:[],dispensers:[],alquileres:[],precios:{bidon:2500,bidonMayorista:2000,alquilerBase:15000}};
function loadDB(){try{const raw=localStorage.getItem(DB_KEY);if(raw)return{...defaultData,...JSON.parse(raw)}}catch(e){}return structuredClone(defaultData)}
function saveDB(data){localStorage.setItem(DB_KEY,JSON.stringify(data))}
function findDispenserForCliente(db,cliente){if(!cliente)return null;return(db.dispensers||[]).find(d=>d.clienteId===cliente.id||(d.nombre&&cliente.nombre&&d.nombre.toLowerCase()===cliente.nombre.toLowerCase()))||null}
function consumoMesDispenser(db,disp,fechaStr){if(!disp)return null;const mes=(fechaStr||today()).slice(0,7);const alq=(db.alquileres||[]).find(a=>a.dispenserClienteId===disp.id&&a.mes===mes);const incluidos=alq?.bidonesIncluidos??disp.bidonesIncluidos??10;const consumidos=alq?.bidonesConsumidos||0;return{mes,incluidos,consumidos,restantes:Math.max(0,incluidos-consumidos)}}
function aplicarConsumoDispenser(db,pedido){if(!pedido||pedido.formaPago!=='Dispenser'||pedido.estado!=='Entregado')return db.alquileres||[];const cli=(db.clientes||[]).find(c=>c.id===pedido.clienteId);const disp=findDispenserForCliente(db,cli);if(!disp)return db.alquileres||[];let alquileres=[...(db.alquileres||[])];const mes=(pedido.fecha||today()).slice(0,7);const existente=alquileres.find(a=>a.dispenserClienteId===disp.id&&a.mes===mes);const cant=Number(pedido.cantidad)||0;if(existente){alquileres=alquileres.map(a=>a.id===existente.id?{...a,bidonesConsumidos:(a.bidonesConsumidos||0)+cant}:a)}else{alquileres.push({id:uid(),dispenserClienteId:disp.id,mes,monto:disp.precioMensual||15000,bidonesIncluidos:disp.bidonesIncluidos??10,bidonesConsumidos:cant,pagado:false,fechaPago:'',formaPago:'',observaciones:''})}return alquileres}

const Icon=({name,size=20,className=''})=>{const s={width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',className};const paths={home:<><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,truck:<><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>,users:<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,droplet:<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>,more:<><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></>,plus:<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,search:<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,x:<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,edit:<><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,phone:<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.92.3 1.82.52 2.69a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.87.22 1.77.4 2.69.52A2 2 0 0 1 22 16.92z"/>,map:<><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></>,package:<><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>,dollar:<><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>};return <svg {...s}>{paths[name]||null}</svg>};
const Logo=({size='md',className=''})=>{const sizes={sm:'w-10 h-10',md:'w-16 h-16',xl:'w-28 h-28'};return <img src="logo.jpg" alt="Logo" className={`${sizes[size]} rounded-full object-cover ${className}`}/>};
const Card=({children,className='',onClick,...rest})=>(<div onClick={onClick} className={`card-live bg-white rounded-2xl shadow-sm border border-slate-100 p-4 ${onClick?'cursor-pointer':''} ${className}`} {...rest}>{children}</div>);
const Badge=({status})=>{const map={'Pendiente':'status-pendiente','En reparto':'status-en-reparto','Entregado':'status-entregado','Cancelado':'status-cancelado'};return <span className={`chip px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${map[status]||'bg-slate-100'}`}>{status}</span>};
const Button=({children,variant='primary',className='',onClick,disabled,size='md'})=>{const base='font-semibold rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 disabled:opacity-50';const sizes={sm:'px-3 py-2 text-sm',md:'px-4 py-3 text-base'};const variants={primary:'bg-brand-blue text-white shadow-md',orange:'bg-brand-orange text-white shadow-md',outline:'border-2 border-brand-blue text-brand-blue bg-white',ghost:'text-slate-600 bg-slate-100',danger:'bg-red-500 text-white'};return <button onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>{children}</button>};
const Input=({label,...props})=>(<div className="mb-3">{label&&<label className="block text-sm font-medium text-slate-600 mb-1">{label}</label>}<input className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-base bg-white" {...props}/></div>);
const Select=({label,children,...props})=>(<div className="mb-3">{label&&<label className="block text-sm font-medium text-slate-600 mb-1">{label}</label>}<select className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-base bg-white" {...props}>{children}</select></div>);
const Textarea=({label,...props})=>(<div className="mb-3">{label&&<label className="block text-sm font-medium text-slate-600 mb-1">{label}</label>}<textarea className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-base bg-white min-h-[80px]" {...props}/></div>);
const Header=({title,onBack,right})=>(<div className="bg-brand-blue text-white px-4 py-4 flex items-center gap-3 sticky top-0 z-30 shadow-md">{onBack&&<button onClick={onBack} className="p-1"><Icon name="x" size={22}/></button>}<h1 className="text-lg font-bold flex-1">{title}</h1>{right}</div>);
const BottomNav=({tab,setTab})=>{const items=[{id:'inicio',label:'Inicio',icon:'home'},{id:'repartos',label:'Repartos',icon:'truck'},{id:'clientes',label:'Clientes',icon:'users'},{id:'dispensers',label:'Dispensers',icon:'droplet'},{id:'mas',label:'Más',icon:'more'}];return(<nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 safe-bottom z-40"><div className="flex justify-around items-center h-16 max-w-lg mx-auto">{items.map(item=>(<button key={item.id} onClick={()=>setTab(item.id)} className={`flex flex-col items-center justify-center flex-1 h-full gap-0.5 ${tab===item.id?'text-brand-blue scale-110':'text-slate-400'}`}><Icon name={item.icon} size={22}/><span className="text-[11px] font-medium">{item.label}</span></button>))}</div></nav>)};
function Splash({onDone}){useEffect(()=>{const t=setTimeout(onDone,2500);return()=>clearTimeout(t)},[onDone]);return(<div className="splash fixed inset-0 z-50 bg-gradient-to-b from-sky-500 to-brand-blue flex flex-col items-center justify-center"><div style={{animation:'popIn .6s ease'}}><Logo size="xl" className="mb-4 shadow-2xl"/></div><p className="text-white/90 mt-4 text-sm font-medium">Gestión de repartos</p></div>)}

function Dashboard({db,setTab,onNewPedido,onSearch}){
  const dia=today();
  const pedidosHoy=db.pedidos.filter(p=>p.fecha===dia);
  const pendientes=pedidosHoy.filter(p=>p.estado==='Pendiente'||p.estado==='En reparto');
  const entregados=pedidosHoy.filter(p=>p.estado==='Entregado');
  const bidonesVendidos=pedidosHoy.filter(p=>esVentaPlata(p)).reduce((s,p)=>s+(p.cantidad||0),0);
  const bidonesDisp=pedidosHoy.filter(p=>p.formaPago==='Dispenser').reduce((s,p)=>s+(p.cantidad||0),0);
  const efectivo=pedidosHoy.filter(p=>p.formaPago==='Efectivo'&&p.estado==='Entregado'&&esVentaPlata(p)).reduce((s,p)=>s+p.cantidad*precioDePedido(p,db),0);
  const transferencias=pedidosHoy.filter(p=>p.formaPago==='Transferencia'&&p.estado==='Entregado'&&esVentaPlata(p)).reduce((s,p)=>s+p.cantidad*precioDePedido(p,db),0);
  const transPendientes=pedidosHoy.filter(p=>p.formaPago==='Transferencia'&&!p.transferenciaAcreditada&&p.estado!=='Cancelado').length;
  const deudas=db.clientes.filter(c=>(c.deuda||0)>0).length;
  const envasesPend=db.clientes.filter(c=>(c.envasesPendientes||0)>0).length;
  return(<div className="pb-24">
    <div className="bg-gradient-to-br from-brand-blue to-sky-600 text-white px-5 pt-8 pb-6 rounded-b-3xl shadow-lg">
      <div className="flex items-center gap-3 mb-6"><Logo size="sm"/><div><h1 className="text-xl font-bold">Aguas Del Paso</h1><p className="text-sky-100 text-sm">{formatFechaLarga(dia)}</p></div></div>
      <div className="grid grid-cols-2 gap-3">
        <div className="stat-box bg-white/15 rounded-2xl p-3 min-h-[72px]"><div className="text-2xl font-bold leading-none">{pedidosHoy.length}</div><div className="text-xs text-sky-100 mt-1.5">Pedidos</div></div>
        <div className="stat-box bg-white/15 rounded-2xl p-3 min-h-[72px]"><div className="text-2xl font-bold leading-none">{bidonesVendidos}</div><div className="text-xs text-sky-100 mt-1.5">Bidones vendidos</div></div>
        <div className="stat-box bg-white/15 rounded-2xl p-3 min-h-[72px]"><div className="text-lg font-bold leading-none">{formatMoney(efectivo)}</div><div className="text-xs text-sky-100 mt-1.5">Efectivo</div></div>
        <div className="stat-box bg-white/15 rounded-2xl p-3 min-h-[72px]"><div className="text-lg font-bold leading-none">{formatMoney(transferencias)}</div><div className="text-xs text-sky-100 mt-1.5">Transferencias</div></div>
      </div>
    </div>
    <div className="px-4 -mt-4"><button onClick={onNewPedido} className="w-full bg-brand-orange text-white font-bold text-lg py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2"><Icon name="plus" size={24}/> NUEVO PEDIDO</button></div>
    <div className="px-4 mt-5 space-y-3">
      <div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" size={18}/></div><input onFocus={onSearch} placeholder="Buscar cliente..." className="w-full pl-10 pr-4 py-3 rounded-xl border bg-white text-base" readOnly/></div>
      <div className="grid grid-cols-2 gap-3">
        <Card className="!p-3 stat-box min-h-[72px]"><div className="text-2xl font-bold text-amber-600 leading-none">{pendientes.length}</div><div className="text-xs text-slate-500 mt-1.5">Pendientes</div></Card>
        <Card className="!p-3 stat-box min-h-[72px]"><div className="text-2xl font-bold text-emerald-600 leading-none">{entregados.length}</div><div className="text-xs text-slate-500 mt-1.5">Entregados</div></Card>
        <Card className="!p-3 stat-box min-h-[72px]"><div className="text-2xl font-bold text-blue-600 leading-none">{transPendientes}</div><div className="text-xs text-slate-500 mt-1.5">Transf. a acreditar</div></Card>
        <Card className="!p-3 stat-box min-h-[72px]"><div className="text-2xl font-bold text-red-500 leading-none">{deudas}</div><div className="text-xs text-slate-500 mt-1.5">Con deuda</div></Card>
      </div>
      {envasesPend>0&&<Card className="bg-orange-50"><div className="flex items-center gap-2 text-brand-orange-dark"><Icon name="package" size={20}/><span className="font-medium">{envasesPend} clientes deben envases</span></div></Card>}
      <Card onClick={()=>setTab('mas')}><div className="font-semibold mb-1">Cierre de {formatFechaLarga(dia)}</div><div className="text-sm text-slate-600">Efectivo {formatMoney(efectivo)} · Transf. {formatMoney(transferencias)}</div><div className="text-xs text-slate-500 mt-1">Dispenser: {bidonesDisp} bidones (sin plata)</div><div className="text-xs text-brand-blue mt-1">Más → Reporte de ventas</div></Card>
    </div>
  </div>);
}

function RepartosScreen({db,setDb,fecha,setFecha,onEditPedido}){
  const pedidos=db.pedidos.filter(p=>p.fecha===fecha).sort((a,b)=>Number(a.prioridad||99)-Number(b.prioridad||99));
  const clientesMap=Object.fromEntries(db.clientes.map(c=>[c.id,c]));
  const[dragId,setDragId]=useState(null);const[overId,setOverId]=useState(null);const[dragPos,setDragPos]=useState(null);
  const cambiarEstado=(id,nuevo)=>{const pedido=db.pedidos.find(p=>p.id===id);const nuevos=db.pedidos.map(p=>p.id===id?{...p,estado:nuevo}:p);let alquileres=db.alquileres||[];if(nuevo==='Entregado'&&pedido&&pedido.estado!=='Entregado'){alquileres=aplicarConsumoDispenser({...db,pedidos:nuevos},{...pedido,estado:'Entregado'})}const next={...db,pedidos:nuevos,alquileres};setDb(next);saveDB(next)};
  const reordenar=(fromId,toId)=>{if(!fromId||!toId||fromId===toId)return;const ids=pedidos.map(p=>p.id);const from=ids.indexOf(fromId),to=ids.indexOf(toId);if(from<0||to<0)return;const arr=[...ids];arr.splice(from,1);arr.splice(to,0,fromId);const nuevos=db.pedidos.map(p=>{const idx=arr.indexOf(p.id);return idx>=0?{...p,prioridad:idx+1}:p});const next={...db,pedidos:nuevos};setDb(next);saveDB(next);setOverId(null);setDragId(null)};
  const cardBajoDedo=(x,y)=>{const el=document.elementFromPoint(x,y);const card=el&&el.closest?el.closest('[data-pedido-id]'):null;return card?card.getAttribute('data-pedido-id'):null};
  const totalBidones=pedidos.filter(p=>p.estado!=='Cancelado').reduce((s,p)=>s+(Number(p.cantidad)||0),0);
  const bidonesEntregados=pedidos.filter(p=>p.estado==='Entregado').reduce((s,p)=>s+(Number(p.cantidad)||0),0);
  return(<div className="pb-24"><Header title="Reparto del día"/>
    <div className="px-4 py-3 bg-white border-b flex items-center gap-3"><input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} className="flex-1 px-3 py-2 rounded-lg border text-base"/><Button size="sm" variant="ghost" onClick={()=>setFecha(today())}>Hoy</Button></div>
    <div className="px-4 py-2 grid grid-cols-2 gap-2">
      <div className="stat-box bg-sky-50 rounded-xl p-2 min-h-[56px]"><div className="text-lg font-bold text-brand-blue leading-none">{totalBidones}</div><div className="text-[10px] text-slate-500 mt-1">Bidones</div></div>
      <div className="stat-box bg-emerald-50 rounded-xl p-2 min-h-[56px]"><div className="text-lg font-bold text-emerald-600 leading-none">{bidonesEntregados}</div><div className="text-[10px] text-slate-500 mt-1">Entregados</div></div>
    </div>
    <p className="px-4 pt-1 text-xs text-slate-400">Mantené ☰ y arrastrá para ordenar.</p>
    {dragId&&dragPos&&(()=>{const p=pedidos.find(x=>x.id===dragId);const cli=p?clientesMap[p.clienteId]:null;return(<div style={{position:'fixed',left:dragPos.x-140,top:dragPos.y-40,width:280,zIndex:80,pointerEvents:'none',transform:'scale(1.04) rotate(-2deg)',boxShadow:'0 20px 40px rgba(2,132,199,.35)'}} className="bg-white rounded-2xl border-2 border-brand-orange p-3"><div className="font-bold text-sm">{cli?.nombre||'Pedido'}</div><div className="text-xs text-slate-500">{p?.cantidad} bidones</div></div>)})()}
    <div className="px-4 py-3 space-y-2.5">
      {pedidos.length===0?(<div className="text-center py-12 text-slate-400"><Icon name="truck" size={48} className="mx-auto mb-3 opacity-40"/><p>No hay pedidos</p></div>):pedidos.map((p,idx)=>{
        const cli=clientesMap[p.clienteId];const disp=findDispenserForCliente(db,cli);const info=disp?consumoMesDispenser(db,disp,p.fecha):null;
        const isDrag=dragId===p.id;const isOver=overId===p.id&&dragId&&dragId!==p.id;
        return(<React.Fragment key={p.id}>{isOver&&<div className="drop-line"/>}
          <Card className={`!p-3 ${isDrag?'opacity-30 border-dashed border-2 border-brand-blue':''}`} data-pedido-id={p.id} onClick={()=>!dragId&&onEditPedido(p)} onDragOver={e=>{e.preventDefault();setOverId(p.id)}} onDrop={e=>{e.preventDefault();reordenar(dragId,p.id)}}>
            <div className="flex items-start gap-2">
              <div className="flex flex-col items-center touch-none select-none shrink-0" draggable onClick={e=>e.stopPropagation()}
                onDragStart={()=>setDragId(p.id)} onDragEnd={()=>{setDragId(null);setOverId(null);setDragPos(null)}}
                onTouchStart={e=>{const t=e.touches[0];setDragId(p.id);setDragPos({x:t.clientX,y:t.clientY})}}
                onTouchMove={e=>{e.preventDefault();const t=e.touches[0];setDragPos({x:t.clientX,y:t.clientY});const id=cardBajoDedo(t.clientX,t.clientY);if(id)setOverId(id)}}
                onTouchEnd={e=>{const t=e.changedTouches[0];const id=cardBajoDedo(t.clientX,t.clientY);if(id)reordenar(p.id,id);setDragId(null);setOverId(null);setDragPos(null)}}>

    const estadoDe=a=>{if(a.estadoPago==='Parcial'||(a.montoPagado>0&&!a.pagado&&a.estadoPago!=='Pagado'))return'Parcial';if(a.pagado||a.estadoPago==='Pagado')return'Pagado';return'Debe'};

        </div>

          <Select label="Forma de pago" value={editingAlq.formaPago||''} onChange={e=>setEditingAlq({...editingAlq,formaPago:e.target.value})}><option value="">—</option><option value="Efectivo">Efectivo</option><option value="Transferencia">Transferencia</option></Select>

        <Button className="w-full" onClick={()=>{const data={...editingAlq,pagado:editingAlq.estadoPago==='Pagado'};const alquileres=(db.alquileres||[]).map(a=>a.id===editingAlq.id?data:a);const next={...db,alquileres};setDb(next);saveDB(next);setEditingAlq(null)}}>Guardar</Button>

  const activos=db.dispensers.filter(d=>d.estado==='Activo');const sumaAlq=activos.reduce((s,d)=>s+Number(d.precioMensual||0),0);const consumoMes=(db.alquileres||[]).filter(a=>a.mes===mesAR()).reduce((s,a)=>s+(a.bidonesConsumidos||0),0);const consumoTotal=(db.alquileres||[]).reduce((s,a)=>s+(a.bidonesConsumidos||0),0);

function MasScreen({db,setDb}){
  const[section,setSection]=useState(null);const[fechaReporte,setFechaReporte]=useState(today());const[modoReporte,setModoReporte]=useState('dia');const[anioReporte,setAnioReporte]=useState(String(new Date().getFullYear()));const[mesReporte,setMesReporte]=useState(mesAR());const[fechaCierre,setFechaCierre]=useState(today());const importRef=useRef(null);
  const calcStats=(lista)=>{const vendidos=lista.filter(p=>p.estado==='Entregado');const bidN=vendidos.filter(p=>p.tipoPrecio!=='mayorista'&&p.tipoPrecio!=='cero'&&p.formaPago!=='Dispenser').reduce((s,p)=>s+(Number(p.cantidad)||0),0);const bidM=vendidos.filter(p=>p.tipoPrecio==='mayorista').reduce((s,p)=>s+(Number(p.cantidad)||0),0);const bid0=vendidos.filter(p=>p.tipoPrecio==='cero').reduce((s,p)=>s+(Number(p.cantidad)||0),0);const bidD=vendidos.filter(p=>p.formaPago==='Dispenser').reduce((s,p)=>s+(Number(p.cantidad)||0),0);const cobrado=vendidos.filter(p=>p.estadoPago!=='Debe'&&esVentaPlata(p)).reduce((s,p)=>s+p.cantidad*precioDePedido(p,db),0);const debe=vendidos.filter(p=>p.estadoPago==='Debe'&&esVentaPlata(p)).reduce((s,p)=>s+p.cantidad*precioDePedido(p,db),0);const efec=vendidos.filter(p=>p.formaPago==='Efectivo'&&p.estadoPago!=='Debe'&&esVentaPlata(p)).reduce((s,p)=>s+p.cantidad*precioDePedido(p,db),0);const trans=vendidos.filter(p=>p.formaPago==='Transferencia'&&p.estadoPago!=='Debe'&&esVentaPlata(p)).reduce((s,p)=>s+p.cantidad*precioDePedido(p,db),0);return{vendidos,bidN,bidM,bid0,bidD,cobrado,debe,efec,trans}};
  if(section==='repartidores')return(<div className="pb-24"><Header title="Repartidores" onBack={()=>setSection(null)}/><div className="px-4 py-3 space-y-2">{db.repartidores.map(r=>(<Card key={r.id}><div className="flex justify-between"><div className="font-bold">{r.nombre}</div><Button size="sm" variant="danger" onClick={()=>{if(!confirm('¿Borrar?'))return;const next={...db,repartidores:db.repartidores.filter(x=>x.id!==r.id)};setDb(next);saveDB(next)}}>Borrar</Button></div></Card>))}<Button className="w-full mt-4" onClick={()=>{const n=prompt('Nombre');if(!n)return;const next={...db,repartidores:[...db.repartidores,{id:uid(),nombre:n,telefono:'',vehiculoId:''}]};setDb(next);saveDB(next)}}>+ Agregar</Button></div></div>);
  if(section==='vehiculos')return(<div className="pb-24"><Header title="Vehículos" onBack={()=>setSection(null)}/><div className="px-4 py-3 space-y-2">{db.vehiculos.map(v=>(<Card key={v.id}><div className="flex justify-between"><div><div className="font-bold">{v.marca} {v.modelo}</div><div className="text-sm text-slate-500">{v.patente}</div></div><Button size="sm" variant="danger" onClick={()=>{if(!confirm('¿Borrar?'))return;const next={...db,vehiculos:db.vehiculos.filter(x=>x.id!==v.id)};setDb(next);saveDB(next)}}>Borrar</Button></div></Card>))}<Button className="w-full mt-4" onClick={()=>{const marca=prompt('Marca');const modelo=prompt('Modelo');const patente=prompt('Patente');if(!marca||!patente)return;const next={...db,vehiculos:[...db.vehiculos,{id:uid(),marca,modelo:modelo||'',patente,anio:new Date().getFullYear(),estado:'Activo'}]};setDb(next);saveDB(next)}}>+ Agregar</Button></div></div>);
  if(section==='reporte'){const lista=modoReporte==='dia'?db.pedidos.filter(p=>p.fecha===fechaReporte):modoReporte==='mes'?db.pedidos.filter(p=>(p.fecha||'').startsWith(mesReporte)):db.pedidos.filter(p=>(p.fecha||'').startsWith(anioReporte));const st=calcStats(lista);const anios=[...new Set(db.pedidos.map(p=>(p.fecha||'').slice(0,4)).filter(Boolean))].sort().reverse();const mesesOpts=[];for(let i=0;i<12;i++){const d=new Date();d.setMonth(d.getMonth()-i);const ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;mesesOpts.push(ym)}

      {modoReporte==='dia'?(<Card className="!p-3"><div className="flex gap-2"><input type="date" value={fechaReporte} onChange={e=>setFechaReporte(e.target.value)} className="flex-1 px-3 py-2 rounded-xl border"/><Button size="sm" variant="ghost" onClick={()=>setFechaReporte(today())}>Hoy</Button></div><div className="font-bold text-brand-blue mt-2">{formatFechaLarga(fechaReporte)}</div></Card>):modoReporte==='mes'?(<Card className="!p-3"><Select label="Mes" value={mesReporte} onChange={e=>setMesReporte(e.target.value)}>{mesesOpts.map(m=><option key={m} value={m}>{formatMes(m)}</option>)}</Select></Card>):(<Card className="!p-3"><Select label="Año" value={anioReporte} onChange={e=>setAnioReporte(e.target.value)}>{[anioReporte,...anios].filter((v,i,a)=>a.indexOf(v)===i).map(a=><option key={a} value={a}>{a}</option>)}</Select></Card>)}
      <div className="grid grid-cols-2 gap-2"><Card className="!p-3 text-center bg-sky-50"><div className="text-xl font-bold text-brand-blue">{st.vendidos.length}</div><div className="text-[11px]">Entregas</div></Card><Card className="!p-3 text-center bg-emerald-50"><div className="text-lg font-bold text-emerald-600">{formatMoney(st.cobrado)}</div><div className="text-[11px]">Cobrado</div></Card></div>

      {modoReporte==='dia'&&st.vendidos.map(p=>{const cli=db.clientes.find(c=>c.id===p.clienteId);return(<Card key={p.id} className="!p-2.5"><div className="font-medium text-sm">{cli?.nombre}</div><div className="text-[11px] text-slate-500">{p.cantidad} bid · {p.tipoPrecio==='cero'?'$0':p.tipoPrecio==='mayorista'?'may.':'normal'} · {p.formaPago}{esVentaPlata(p)?` · ${formatMoney(p.cantidad*precioDePedido(p,db))}`:''}</div></Card>)})}
    </div></div>)}
  if(section==='cierre'){const lista=db.pedidos.filter(p=>p.fecha===fechaCierre&&p.estado!=='Cancelado');const st=calcStats(lista);const transfPend=lista.filter(p=>p.formaPago==='Transferencia'&&!p.transferenciaAcreditada&&p.estado!=='Cancelado');const deudasDia=lista.filter(p=>p.estadoPago==='Debe'&&esVentaPlata(p));

      <Card className="bg-emerald-50"><div className="text-sm font-semibold text-emerald-800 mb-2">Efectivo en mano</div><div className="text-2xl font-bold text-emerald-700">{formatMoney(st.efec)}</div></Card>
      <Card><div className="font-semibold mb-2">Resumen del día</div><div className="text-sm space-y-1"><div className="flex justify-between"><span>Entregas</span><strong>{st.vendidos.length}</strong></div><div className="flex justify-between"><span>Bidones</span><strong>{st.bidN+st.bidM+st.bid0+st.bidD}</strong></div><div className="flex justify-between"><span>Efectivo</span><strong>{formatMoney(st.efec)}</strong></div><div className="flex justify-between"><span>Transferencias</span><strong>{formatMoney(st.trans)}</strong></div><div className="flex justify-between"><span>Cobrado total</span><strong className="text-emerald-600">{formatMoney(st.cobrado)}</strong></div><div className="flex justify-between"><span>Quedó debiendo</span><strong className="text-red-500">{formatMoney(st.debe)}</strong></div></div></Card>
      {transfPend.length>0&&<Card className="bg-amber-50"><div className="font-semibold text-amber-800 mb-2">Transf. sin acreditar ({transfPend.length})</div>{transfPend.map(p=>{const cli=db.clientes.find(c=>c.id===p.clienteId);return(<div key={p.id} className="flex justify-between items-center py-1.5 border-b border-amber-100 last:border-0"><div><div className="text-sm font-medium">{cli?.nombre}</div><div className="text-[11px] text-slate-500">{formatMoney(p.cantidad*precioDePedido(p,db))}</div></div><Button size="sm" variant="outline" onClick={()=>{const pedidos=db.pedidos.map(x=>x.id===p.id?{...x,transferenciaAcreditada:true}:x);const next={...db,pedidos};setDb(next);saveDB(next)}}>Acreditar</Button></div>)})}</Card>}
      {deudasDia.length>0&&<Card className="bg-red-50"><div className="font-semibold text-red-700 mb-2">Deudas del día</div>{deudasDia.map(p=>{const cli=db.clientes.find(c=>c.id===p.clienteId);return(<div key={p.id} className="text-sm py-1">{cli?.nombre}: {formatMoney(p.cantidad*precioDePedido(p,db))}</div>)})}</Card>}
    </div></div>)}
  if(section==='envases'){const lista=db.clientes.filter(c=>(c.envasesPendientes||0)>0).sort((a,b)=>(b.envasesPendientes||0)-(a.envasesPendientes||0));
    return(<div className="pb-24"><Header title="Deben envases" onBack={()=>setSection(null)}/><div className="px-4 py-3 space-y-2">
      <Card className="bg-orange-50 !p-3 text-center"><div className="text-2xl font-bold text-orange-600">{lista.reduce((s,c)=>s+(c.envasesPendientes||0),0)}</div><div className="text-xs text-slate-500">Envases pendientes · {lista.length} clientes</div></Card>
      {lista.length===0?<p className="text-center text-slate-400 py-8">Nadie debe envases</p>:lista.map(c=>(<Card key={c.id} className="!p-3"><div className="flex justify-between items-center"><div><div className="font-semibold">{c.nombre}</div><div className="text-[11px] text-slate-500">{c.barrio||c.direccion||''}</div></div><div className="text-orange-600 font-bold">{c.envasesPendientes} env.</div></div></Card>))}
    </div></div>)}
  if(section==='deudas'){const conDeuda=db.clientes.filter(c=>(c.deuda||0)>0).sort((a,b)=>(b.deuda||0)-(a.deuda||0));const transfPend=db.pedidos.filter(p=>p.formaPago==='Transferencia'&&!p.transferenciaAcreditada&&p.estado!=='Cancelado').sort((a,b)=>b.fecha.localeCompare(a.fecha));
    return(<div className="pb-24"><Header title="Deudas y transferencias" onBack={()=>setSection(null)}/><div className="px-4 py-3 space-y-4">
      <div><h3 className="font-bold mb-2 text-red-600">Clientes que deben</h3>
        {conDeuda.length===0?<p className="text-sm text-slate-400 mb-2">Nadie debe plata</p>:conDeuda.map(c=>(<Card key={c.id} className="!p-3 mb-2"><div className="flex justify-between"><div><div className="font-semibold">{c.nombre}</div><div className="text-[11px] text-slate-500">{c.barrio||''}</div></div><div className="text-red-600 font-bold">{formatMoney(c.deuda)}</div></div></Card>))}
      </div>
      <div><h3 className="font-bold mb-2 text-amber-600">Transferencias sin confirmar</h3>
        {transfPend.length===0?<p className="text-sm text-slate-400">Ninguna pendiente</p>:transfPend.map(p=>{const cli=db.clientes.find(c=>c.id===p.clienteId);return(<Card key={p.id} className="!p-3 mb-2"><div className="flex justify-between items-center gap-2"><div className="min-w-0"><div className="font-semibold truncate">{cli?.nombre||'—'}</div><div className="text-[11px] text-slate-500">{p.fecha} · {p.cantidad} bid · {formatMoney(p.cantidad*precioDePedido(p,db))}</div></div><Button size="sm" variant="outline" onClick={()=>{const pedidos=db.pedidos.map(x=>x.id===p.id?{...x,transferenciaAcreditada:true}:x);const next={...db,pedidos};setDb(next);saveDB(next)}}>OK</Button></div></Card>)})}
      </div>
    </div></div>)}
  if(section==='precios')return(<div className="pb-24"><Header title="Precios" onBack={()=>setSection(null)}/><div className="px-4 py-4">
    <Input label="Bidón normal ($)" type="number" min="0" value={db.precios?.bidon??2500} onChange={e=>{const next={...db,precios:{...db.precios,bidon:Number(e.target.value)}};setDb(next);saveDB(next)}}/>
    <Input label="Bidón mayorista ($)" type="number" min="0" value={db.precios?.bidonMayorista??2000} onChange={e=>{const next={...db,precios:{...db.precios,bidonMayorista:Number(e.target.value)}};setDb(next);saveDB(next)}}/>
    <p className="text-xs text-slate-500 -mt-2 mb-3">En cada pedido: normal, mayorista o <strong>$0 sin cargo</strong>.</p>
    <Input label="Alquiler dispenser ($)" type="number" min="0" value={db.precios?.alquilerBase??15000} onChange={e=>{const next={...db,precios:{...db.precios,alquilerBase:Number(e.target.value)}};setDb(next);saveDB(next)}}/>
  </div></div>);
  const importarBackup=e=>{const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(!data||typeof data!=='object')throw new Error('Formato inválido');if(!confirm('¿Reemplazar todos los datos actuales por el backup?'))return;const next={...defaultData,...data};setDb(next);saveDB(next);alert('Backup importado correctamente');setSection(null)}catch(err){alert('No se pudo leer el archivo')}};reader.readAsText(file);e.target.value=''};
  return(<div className="pb-24"><Header title="Más opciones"/><div className="px-4 py-3 space-y-2">
    <Card onClick={()=>setSection('cierre')} className="flex items-center gap-3"><Icon name="dollar" size={22} className="text-emerald-600"/><span className="font-medium">Cierre de caja</span></Card>
    <Card onClick={()=>setSection('reporte')} className="flex items-center gap-3"><Icon name="package" size={22} className="text-brand-orange"/><span className="font-medium">Reporte de ventas</span></Card>
    <Card onClick={()=>setSection('envases')} className="flex items-center gap-3"><Icon name="package" size={22} className="text-orange-600"/><span className="font-medium">Deben envases</span></Card>
    <Card onClick={()=>setSection('deudas')} className="flex items-center gap-3"><Icon name="dollar" size={22} className="text-red-500"/><span className="font-medium">Deudas y transferencias</span></Card>
    <Card onClick={()=>setSection('repartidores')} className="flex items-center gap-3"><Icon name="users" size={22} className="text-brand-blue"/><span className="font-medium">Repartidores</span></Card>
    <Card onClick={()=>setSection('vehiculos')} className="flex items-center gap-3"><Icon name="truck" size={22} className="text-brand-blue"/><span className="font-medium">Vehículos</span></Card>
    <Card onClick={()=>setSection('precios')} className="flex items-center gap-3"><Icon name="dollar" size={22} className="text-brand-blue"/><span className="font-medium">Precios</span></Card>
    <Card onClick={()=>{if(confirm('¿Exportar backup?')){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup-${today()}.json`;a.click()}}} className="flex items-center gap-3"><Icon name="package" size={22} className="text-brand-blue"/><span className="font-medium">Exportar backup</span></Card>
    <Card onClick={()=>importRef.current?.click()} className="flex items-center gap-3"><Icon name="package" size={22} className="text-brand-blue"/><span className="font-medium">Importar backup</span></Card>
    <input ref={importRef} type="file" accept="application/json,.json" className="hidden" onChange={importarBackup}/>
  </div></div>);
}
function App(){
  const[splash,setSplash]=useState(true);const[db,setDb]=useState(loadDB);const[tab,setTab]=useState('inicio');
  const[fechaReparto,setFechaReparto]=useState(today());const[showNuevoPedido,setShowNuevoPedido]=useState(false);
  const[showNuevoCliente,setShowNuevoCliente]=useState(false);const[clienteSeleccionado,setClienteSeleccionado]=useState(null);
  const[clienteParaPedido,setClienteParaPedido]=useState(null);const[pedidoEditar,setPedidoEditar]=useState(null);const[showSearch,setShowSearch]=useState(false);
  useEffect(()=>{saveDB(db)},[db]);
  if(splash)return <Splash onDone={()=>setSplash(false)}/>;
  return(<div className="min-h-screen max-w-lg mx-auto bg-slate-50 relative">
    {tab==='inicio'&&!clienteSeleccionado&&<Dashboard db={db} setTab={setTab} onNewPedido={()=>{setClienteParaPedido(null);setPedidoEditar(null);setShowNuevoPedido(true)}} onSearch={()=>setShowSearch(true)}/>}
    {tab==='repartos'&&!clienteSeleccionado&&<RepartosScreen db={db} setDb={setDb} fecha={fechaReparto} setFecha={setFechaReparto} onEditPedido={p=>{setPedidoEditar(p);setShowNuevoPedido(true)}}/>}
    {tab==='clientes'&&!clienteSeleccionado&&<ClientesScreen db={db} onSelectCliente={setClienteSeleccionado} onNewCliente={()=>setShowNuevoCliente(true)}/>}
    {tab==='dispensers'&&!clienteSeleccionado&&<DispensersScreen db={db} setDb={setDb}/>}
    {tab==='mas'&&!clienteSeleccionado&&<MasScreen db={db} setDb={setDb}/>}
    {clienteSeleccionado&&<ClienteDetail cliente={clienteSeleccionado} db={db} setDb={setDb} onBack={()=>setClienteSeleccionado(null)} onEdit={()=>setShowNuevoCliente(true)} onNewPedido={c=>{setClienteParaPedido(c);setPedidoEditar(null);setShowNuevoPedido(true)}}/>}
    {showNuevoPedido&&<NuevoPedidoModal db={db} setDb={setDb} onClose={()=>{setShowNuevoPedido(false);setPedidoEditar(null);setClienteParaPedido(null)}} clientePreseleccionado={clienteParaPedido} pedidoEditar={pedidoEditar}/>}
    {showNuevoCliente&&<ClienteFormModal db={db} setDb={setDb} clienteEditar={clienteSeleccionado} onClose={cli=>{setShowNuevoCliente(false);if(cli&&clienteSeleccionado)setClienteSeleccionado(cli)}}/>}
    {showSearch&&(<div className="fixed inset-0 z-50 bg-black/50 flex items-end justify-center"><div className="bg-white w-full rounded-t-3xl p-4 max-h-[80vh] overflow-y-auto">
      <div className="flex justify-between mb-3"><h2 className="font-bold">Buscar</h2><button onClick={()=>setShowSearch(false)}><Icon name="x" size={22}/></button></div>
      <Input autoFocus placeholder="Nombre" onChange={e=>{window.__sq=e.target.value.toLowerCase()}}/>
      {db.clientes.filter(c=>{const t=window.__sq||'';return!t||(c.nombre||'').toLowerCase().includes(t)}).slice(0,15).map(c=>(<button key={c.id} className="w-full text-left px-3 py-2 border-b" onClick={()=>{setClienteSeleccionado(c);setShowSearch(false);setTab('clientes')}}><div className="font-medium">{c.nombre}</div></button>))}
    </div></div>)}
    {!clienteSeleccionado&&<BottomNav tab={tab} setTab={setTab}/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
