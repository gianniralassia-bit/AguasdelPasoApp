<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Aguas Del Paso</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="logo.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0284c7',
              'blue-dark': '#0369a1',
              'blue-light': '#e0f2fe',
              orange: '#f97316',
              'orange-dark': '#ea580c',
              'orange-light': '#ffedd5',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior: none; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .splash { animation: fadeOut 0.5s ease-in-out 2.2s forwards; }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes popIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes pulseSoft { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .status-pendiente { background: #fef3c7; color: #92400e; }
    .status-en-reparto { background: #dbeafe; color: #1e40af; }
    .status-entregado { background: #d1fae5; color: #065f46; }
    .status-cancelado { background: #fee2e2; color: #991b1b; }
    .card-live { animation: fadeUp .35s ease both; transition: transform .25s ease, box-shadow .25s ease, opacity .25s ease, margin .25s ease; }
    .card-live:active { transform: scale(.98); }
    .drag-lift {
      transform: scale(1.03) rotate(-1.2deg);
      box-shadow: 0 18px 40px rgba(2,132,199,.28);
      opacity: .95;
      z-index: 20;
      position: relative;
    }
    .drop-target {
      transform: translateY(4px);
      box-shadow: 0 0 0 2px #f97316 inset;
    }
    .drop-line {
      height: 6px;
      border-radius: 99px;
      background: linear-gradient(90deg, #0284c7, #f97316);
      margin: 2px 0 10px;
      animation: pulseSoft .8s ease-in-out infinite;
    }
    .handle-grip { animation: pulseSoft 1.8s ease-in-out infinite; }
    .tab-dot { transition: transform .2s ease, background .2s ease; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ==================== UTILITIES ====================
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    const today = () => new Date().toISOString().slice(0, 10);
    const formatDate = (d) => {
      if (!d) return '';
      const [y, m, day] = d.split('-');
      return `${day}/${m}/${y}`;
    };
    const formatMoney = (n) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(n || 0);
    const MESES_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    const formatMes = (ym) => {
      if (!ym) return '';
      const [y, m] = ym.split('-');
      return `${MESES_ES[Number(m) - 1] || m} ${y}`;
    };
    const mesesCercanos = () => {
      const out = [];
      const now = new Date();
      for (let i = -6; i <= 2; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
        const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        out.push(ym);
      }
      return out;
    };

    // ==================== STORAGE ====================
    const DB_KEY = 'aguas_del_paso_v1';
    const defaultData = {
      repartidores: [
        { id: 'r1', nombre: 'Juan Pérez', telefono: '', foto: '', vehiculoId: 'v1' }
      ],
      vehiculos: [
        { id: 'v1', marca: 'Fiat', modelo: 'Fiorino', patente: 'ABC 123', anio: 2019, tipo: 'Utilitario', repartidorHabitualId: 'r1', estado: 'Activo' }
      ],
      clientes: [],
      pedidos: [],
      dispensers: [],
      alquileres: [],
      precios: { bidon: 2500, alquilerBase: 15000 }
    };

    function loadDB() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (raw) return { ...defaultData, ...JSON.parse(raw) };
      } catch (e) {}
      return structuredClone(defaultData);
    }
    function saveDB(data) {
      localStorage.setItem(DB_KEY, JSON.stringify(data));
    }

    function findDispenserForCliente(db, cliente) {
      if (!cliente) return null;
      return (db.dispensers || []).find(d =>
        d.clienteId === cliente.id ||
        (d.nombre && cliente.nombre && d.nombre.toLowerCase() === cliente.nombre.toLowerCase())
      ) || null;
    }

    function consumoMesDispenser(db, disp, fechaStr) {
      if (!disp) return null;
      const mes = (fechaStr || today()).slice(0, 7);
      const alq = (db.alquileres || []).find(a => a.dispenserClienteId === disp.id && a.mes === mes);
      const incluidos = alq?.bidonesIncluidos ?? disp.bidonesIncluidos ?? 10;
      const consumidos = alq?.bidonesConsumidos || 0;
      return { mes, incluidos, consumidos, restantes: Math.max(0, incluidos - consumidos), excedente: Math.max(0, consumidos - incluidos) };
    }

    function aplicarConsumoDispenser(db, pedido) {
      if (!pedido || pedido.formaPago !== 'Dispenser' || pedido.estado !== 'Entregado') return db.alquileres || [];
      const cli = (db.clientes || []).find(c => c.id === pedido.clienteId);
      const disp = findDispenserForCliente(db, cli);
      if (!disp) return db.alquileres || [];
      let alquileres = [...(db.alquileres || [])];
      const mes = (pedido.fecha || today()).slice(0, 7);
      const existente = alquileres.find(a => a.dispenserClienteId === disp.id && a.mes === mes);
      const cant = Number(pedido.cantidad) || 0;
      if (existente) {
        alquileres = alquileres.map(a => a.id === existente.id
          ? { ...a, bidonesConsumidos: (a.bidonesConsumidos || 0) + cant }
          : a);
      } else {
        alquileres.push({
          id: uid(),
          dispenserClienteId: disp.id,
          mes,
          monto: disp.precioMensual || 15000,
          bidonesIncluidos: disp.bidonesIncluidos ?? 10,
          bidonesConsumidos: cant,
          pagado: false,
          fechaPago: '',
          formaPago: '',
          observaciones: ''
        });
      }
      return alquileres;
    }

    // ==================== ICONS (simple SVG) ====================
    const Icon = ({ name, size = 24, className = '' }) => {
      const icons = {
        home: <><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
        truck: <><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>,
        users: <><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
        droplet: <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>,
        more: <><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></>,
        plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
        search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
        chevron: <polyline points="9 18 15 12 9 6"/>,
        check: <polyline points="20 6 9 17 4 12"/>,
        x: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
        edit: <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
        calendar: <><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>,
        phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>,
        map: <><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></>,
        package: <><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></>,
        dollar: <><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>,
        back: <><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>,
        trash: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>,
        settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {icons[name] || icons.home}
        </svg>
      );
    };

    // ==================== LOGO ====================
    const Logo = ({ size = 'md', className = '' }) => {
      const sizes = { sm: 'w-10 h-10', md: 'w-14 h-14', lg: 'w-24 h-24', xl: 'w-40 h-40' };
      return (
        <img
          src="logo.jpg"
          alt="Aguas del Paso"
          className={`${sizes[size]} ${className} rounded-full object-cover shadow-lg border-2 border-white`}
        />
      );
    };

    // ==================== COMPONENTS ====================
    const Badge = ({ status }) => {
      const map = {
        'Pendiente': 'status-pendiente',
        'En reparto': 'status-en-reparto',
        'Entregado': 'status-entregado',
        'Cancelado': 'status-cancelado'
      };
      return <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${map[status] || 'bg-slate-100'}`}>{status}</span>;
    };

    const BottomNav = ({ tab, setTab }) => {
      const items = [
        { id: 'inicio', label: 'Inicio', icon: 'home' },
        { id: 'repartos', label: 'Repartos', icon: 'truck' },
        { id: 'clientes', label: 'Clientes', icon: 'users' },
        { id: 'dispensers', label: 'Dispensers', icon: 'droplet' },
        { id: 'mas', label: 'Más', icon: 'more' },
      ];
      return (
        <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 safe-bottom z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
          <div className="flex justify-around items-center h-16 max-w-lg mx-auto">
            {items.map(item => (
              <button key={item.id} onClick={() => setTab(item.id)}
                className={`flex flex-col items-center justify-center flex-1 h-full gap-0.5 transition-all duration-200 ${tab === item.id ? 'text-brand-blue scale-110' : 'text-slate-400'}`}>
                <Icon name={item.icon} size={22} />
                <span className="text-[11px] font-medium">{item.label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    };

    const Header = ({ title, onBack, right }) => (
      <header className="sticky top-0 z-30 bg-brand-blue text-white px-4 py-3 flex items-center gap-3 shadow-md">
        {onBack && (
          <button onClick={onBack} className="p-1 -ml-1 rounded-full hover:bg-white/20">
            <Icon name="back" size={22} />
          </button>
        )}
        <h1 className="text-lg font-bold flex-1 truncate">{title}</h1>
        {right}
      </header>
    );

    const Card = ({ children, className = '', onClick, ...rest }) => (
      <div onClick={onClick} className={`card-live bg-white rounded-2xl shadow-sm border border-slate-100 p-4 ${onClick ? 'cursor-pointer' : ''} ${className}`} {...rest}>
        {children}
      </div>
    );

    const Button = ({ children, variant = 'primary', className = '', onClick, disabled, size = 'md' }) => {
      const base = 'font-semibold rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 disabled:opacity-50';
      const sizes = { sm: 'px-3 py-2 text-sm', md: 'px-4 py-3 text-base', lg: 'px-6 py-4 text-lg' };
      const variants = {
        primary: 'bg-brand-blue text-white shadow-md shadow-sky-200',
        orange: 'bg-brand-orange text-white shadow-md shadow-orange-200',
        outline: 'border-2 border-brand-blue text-brand-blue bg-white',
        ghost: 'text-slate-600 bg-slate-100',
        danger: 'bg-red-500 text-white'
      };
      return (
        <button onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
          {children}
        </button>
      );
    };

    const Input = ({ label, ...props }) => (
      <div className="mb-3">
        {label && <label className="block text-sm font-medium text-slate-600 mb-1">{label}</label>}
        <input className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-brand-blue/40 focus:border-brand-blue text-base" {...props} />
      </div>
    );

    const Select = ({ label, children, ...props }) => (
      <div className="mb-3">
        {label && <label className="block text-sm font-medium text-slate-600 mb-1">{label}</label>}
        <select className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-brand-blue/40 text-base appearance-none" {...props}>
          {children}
        </select>
      </div>
    );

    const Textarea = ({ label, ...props }) => (
      <div className="mb-3">
        {label && <label className="block text-sm font-medium text-slate-600 mb-1">{label}</label>}
        <textarea className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-brand-blue/40 text-base resize-none" rows={3} {...props} />
      </div>
    );

    // ==================== SCREENS ====================
    function Splash({ onDone }) {
      useEffect(() => {
        const t = setTimeout(onDone, 2500);
        return () => clearTimeout(t);
      }, [onDone]);
      return (
        <div className="splash fixed inset-0 z-50 bg-gradient-to-b from-sky-500 to-brand-blue flex flex-col items-center justify-center">
          <div style={{ animation: 'popIn .6s ease' }}><Logo size="xl" className="mb-4 shadow-2xl" /></div>
          <p className="text-white/90 mt-4 text-sm font-medium tracking-wide">Gestión de repartos</p>
        </div>
      );
    }

    function Dashboard({ db, setTab, onNewPedido, onSearch }) {
      const hoy = today();
      const pedidosHoy = db.pedidos.filter(p => p.fecha === hoy);
      const pendientes = pedidosHoy.filter(p => p.estado === 'Pendiente' || p.estado === 'En reparto');
      const entregados = pedidosHoy.filter(p => p.estado === 'Entregado');
      const bidones = pedidosHoy.reduce((s, p) => s + (p.cantidad || 0), 0);
      const efectivo = pedidosHoy.filter(p => p.formaPago === 'Efectivo' && p.estado === 'Entregado').reduce((s, p) => s + (p.cantidad * (db.precios?.bidon || 2500)), 0);
      const transferencias = pedidosHoy.filter(p => p.formaPago === 'Transferencia' && p.estado === 'Entregado').reduce((s, p) => s + (p.cantidad * (db.precios?.bidon || 2500)), 0);
      const transPendientes = pedidosHoy.filter(p => p.formaPago === 'Transferencia' && !p.transferenciaAcreditada && p.estado !== 'Cancelado').length;
      const deudas = db.clientes.filter(c => (c.deuda || 0) > 0).length;
      const envasesPend = db.clientes.filter(c => (c.envasesPendientes || 0) > 0).length;

      return (
        <div className="pb-24">
          <div className="bg-gradient-to-br from-brand-blue to-sky-600 text-white px-5 pt-8 pb-6 rounded-b-3xl shadow-lg">
            <div className="flex items-center gap-3 mb-6">
              <Logo size="sm" />
              <div>
                <h1 className="text-xl font-bold">Aguas Del Paso</h1>
                <p className="text-sky-100 text-sm">{formatDate(hoy)}</p>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div className="bg-white/15 backdrop-blur rounded-2xl p-3">
                <div className="text-2xl font-bold">{pedidosHoy.length}</div>
                <div className="text-xs text-sky-100">Pedidos hoy</div>
              </div>
              <div className="bg-white/15 backdrop-blur rounded-2xl p-3">
                <div className="text-2xl font-bold">{bidones}</div>
                <div className="text-xs text-sky-100">Bidones</div>
              </div>
              <div className="bg-white/15 backdrop-blur rounded-2xl p-3">
                <div className="text-lg font-bold">{formatMoney(efectivo)}</div>
                <div className="text-xs text-sky-100">Efectivo</div>
              </div>
              <div className="bg-white/15 backdrop-blur rounded-2xl p-3">
                <div className="text-lg font-bold">{formatMoney(transferencias)}</div>
                <div className="text-xs text-sky-100">Transferencias</div>
              </div>
            </div>
          </div>

          <div className="px-4 -mt-4">
            <button onClick={onNewPedido} className="w-full bg-brand-orange text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-orange-200 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
              <Icon name="plus" size={24} /> NUEVO PEDIDO
            </button>
          </div>

          <div className="px-4 mt-5 space-y-3">
            <div className="relative">
              <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="search" size={18} /></div>
              <input onFocus={onSearch} placeholder="Buscar cliente..." className="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 bg-white text-base" readOnly />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <Card className="!p-3">
                <div className="text-2xl font-bold text-amber-600">{pendientes.length}</div>
                <div className="text-xs text-slate-500">Pendientes</div>
              </Card>
              <Card className="!p-3">
                <div className="text-2xl font-bold text-emerald-600">{entregados.length}</div>
                <div className="text-xs text-slate-500">Entregados</div>
              </Card>
              <Card className="!p-3">
                <div className="text-2xl font-bold text-blue-600">{transPendientes}</div>
                <div className="text-xs text-slate-500">Transf. a acreditar</div>
              </Card>
              <Card className="!p-3">
                <div className="text-2xl font-bold text-red-500">{deudas}</div>
                <div className="text-xs text-slate-500">Con deuda</div>
              </Card>
            </div>

            {envasesPend > 0 && (
              <Card className="bg-orange-50 border-orange-100">
                <div className="flex items-center gap-2 text-brand-orange-dark">
                  <Icon name="package" size={20} />
                  <span className="font-medium">{envasesPend} clientes deben envases</span>
                </div>
              </Card>
            )}
          </div>
        </div>
      );
    }

    function RepartosScreen({ db, setDb, fecha, setFecha, onEditPedido }) {
      const pedidos = db.pedidos.filter(p => p.fecha === fecha).sort((a, b) => {
        const pa = Number(a.prioridad || 99);
        const pb = Number(b.prioridad || 99);
        if (pa !== pb) return pa - pb;
        return 0;
      });
      const clientesMap = Object.fromEntries(db.clientes.map(c => [c.id, c]));
      const [dragId, setDragId] = useState(null);
      const [overId, setOverId] = useState(null);

      const cambiarEstado = (id, nuevo) => {
        const pedido = db.pedidos.find(p => p.id === id);
        const nuevos = db.pedidos.map(p => p.id === id ? { ...p, estado: nuevo } : p);
        let alquileres = db.alquileres || [];
        if (nuevo === 'Entregado' && pedido && pedido.estado !== 'Entregado') {
          alquileres = aplicarConsumoDispenser({ ...db, pedidos: nuevos }, { ...pedido, estado: 'Entregado' });
        }
        const next = { ...db, pedidos: nuevos, alquileres };
        setDb(next); saveDB(next);
      };

      const reordenar = (fromId, toId) => {
        if (!fromId || !toId || fromId === toId) return;
        const ids = pedidos.map(p => p.id);
        const from = ids.indexOf(fromId);
        const to = ids.indexOf(toId);
        if (from < 0 || to < 0) return;
        const arr = [...ids];
        arr.splice(from, 1);
        arr.splice(to, 0, fromId);
        const nuevos = db.pedidos.map(p => {
          const idx = arr.indexOf(p.id);
          return idx >= 0 ? { ...p, prioridad: idx + 1 } : p;
        });
        const next = { ...db, pedidos: nuevos };
        setDb(next); saveDB(next);
        setOverId(null);
        setDragId(null);
      };

      const cardBajoDedo = (x, y) => {
        const el = document.elementFromPoint(x, y);
        const card = el && el.closest ? el.closest('[data-pedido-id]') : null;
        return card ? card.getAttribute('data-pedido-id') : null;
      };

      return (
        <div className="pb-24">
          <Header title="Reparto del día" />
          <div className="px-4 py-3 bg-white border-b flex items-center gap-3">
            <input type="date" value={fecha} onChange={e => setFecha(e.target.value)}
              className="flex-1 px-3 py-2 rounded-lg border border-slate-200 text-base" />
            <Button size="sm" variant="ghost" onClick={() => setFecha(today())}>Hoy</Button>
          </div>
          <p className="px-4 pt-2 text-xs text-slate-400">Mantené el ícono ☰ y arrastrá el pedido más arriba o más abajo para ordenar la ruta.</p>
          <div className="px-4 py-3 space-y-3">
            {pedidos.length === 0 ? (
              <div className="text-center py-12 text-slate-400">
                <Icon name="truck" size={48} className="mx-auto mb-3 opacity-40" />
                <p>No hay pedidos para esta fecha</p>
              </div>
            ) : pedidos.map((p, idx) => {
              const cli = clientesMap[p.clienteId];
              const disp = findDispenserForCliente(db, cli);
              const info = disp ? consumoMesDispenser(db, disp, p.fecha) : null;
              const isDrag = dragId === p.id;
              const isOver = overId === p.id && dragId && dragId !== p.id;
              return (
                <React.Fragment key={p.id}>
                {isOver && <div className="drop-line" />}
                <Card className={`${isDrag ? 'drag-lift' : ''} ${isOver ? 'drop-target' : ''}`}
                  data-pedido-id={p.id}
                  onClick={() => !dragId && onEditPedido(p)}
                  onDragOver={e => { e.preventDefault(); setOverId(p.id); }}
                  onDrop={e => { e.preventDefault(); reordenar(dragId, p.id); }}
                >
                  <div className="flex justify-between items-start mb-2">
                    <div className="flex items-start gap-2">
                      <div
                        className="flex flex-col items-center mr-1 touch-none select-none"
                        draggable
                        onClick={e => e.stopPropagation()}
                        onDragStart={() => setDragId(p.id)}
                        onDragEnd={() => { setDragId(null); setOverId(null); }}
                        onTouchStart={() => setDragId(p.id)}
                        onTouchMove={(e) => {
                          const t = e.touches[0];
                          const id = cardBajoDedo(t.clientX, t.clientY);
                          if (id) setOverId(id);
                        }}
                        onTouchEnd={(e) => {
                          const t = e.changedTouches[0];
                          const id = cardBajoDedo(t.clientX, t.clientY);
                          if (id) reordenar(p.id, id);
                          setDragId(null);
                          setOverId(null);
                        }}
                      >
                        <div className={`w-8 h-8 rounded-full bg-brand-blue text-white font-bold flex items-center justify-center text-sm ${isDrag ? 'scale-110' : ''}`}>{idx + 1}</div>
                        <div className={`mt-1 text-slate-400 text-lg leading-none cursor-grab active:cursor-grabbing ${isDrag ? 'text-brand-orange handle-grip' : ''}`}>☰</div>
                      </div>
                      <div data-pedido-id={p.id}>
                        <div className="font-bold text-base">{cli?.nombre || 'Cliente'}</div>
                        <div className="text-sm text-slate-500">{cli?.barrio} · {cli?.direccion}</div>
                      </div>
                    </div>
                    <Badge status={p.estado} />
                  </div>
                  <div className="flex flex-wrap gap-2 text-sm mt-2">
                    <span className="bg-sky-50 text-brand-blue px-2 py-0.5 rounded-lg font-medium">{p.cantidad} bidones</span>
                    <span className="bg-slate-50 px-2 py-0.5 rounded-lg">{p.formaPago}</span>
                    {disp && (
                      <span className="bg-orange-50 text-orange-700 px-2 py-0.5 rounded-lg">
                        Dispenser · quedan {info?.restantes ?? 0}/{info?.incluidos ?? 0}
                      </span>
                    )}
                    {p.formaPago === 'Transferencia' && (
                      <span className={`px-2 py-0.5 rounded-lg ${p.transferenciaAcreditada ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>
                        {p.transferenciaAcreditada ? '✓ Acreditada' : '⏳ Pendiente'}
                      </span>
                    )}
                  </div>
                  {p.estado !== 'Entregado' && p.estado !== 'Cancelado' && (
                    <div className="flex gap-2 mt-3">
                      {p.estado === 'Pendiente' && (
                        <Button size="sm" variant="outline" className="flex-1" onClick={(e) => { e.stopPropagation(); cambiarEstado(p.id, 'En reparto'); }}>
                          En reparto
                        </Button>
                      )}
                      <Button size="sm" variant="primary" className="flex-1" onClick={(e) => { e.stopPropagation(); cambiarEstado(p.id, 'Entregado'); }}>
                        Entregar
                      </Button>
                    </div>
                  )}
                </Card>
                </React.Fragment>
              );
            })}
          </div>
        </div>
      );
    }

      );

    function ClienteDetail({ cliente, db, setDb, onBack, onEdit, onNewPedido }) {
      const historial = db.pedidos.filter(p => p.clienteId === cliente.id).sort((a, b) => b.fecha.localeCompare(a.fecha));
      const precio = db.precios?.bidon || 2500;
      const disp = findDispenserForCliente(db, cliente);
      const [mesSel, setMesSel] = useState(today().slice(0, 7));
      const infoDisp = disp ? consumoMesDispenser(db, disp, mesSel + '-01') : null;
      const alqMes = disp ? (db.alquileres || []).find(a => a.dispenserClienteId === disp.id && a.mes === mesSel) : null;

      const marcarPagoMes = (pagado, formaPago) => {
        if (!disp) return;
        let alquileres = [...(db.alquileres || [])];
        if (alqMes) {
          alquileres = alquileres.map(a => a.id === alqMes.id ? {
            ...a,
            pagado,
            formaPago: pagado ? (formaPago || a.formaPago || 'Efectivo') : '',
            fechaPago: pagado ? (a.fechaPago || today()) : ''
          } : a);
        } else {
          alquileres.push({
            id: uid(),
            dispenserClienteId: disp.id,
            mes: mesSel,
            monto: disp.precioMensual || 15000,
            bidonesIncluidos: disp.bidonesIncluidos ?? 10,
            bidonesConsumidos: infoDisp?.consumidos || 0,
            pagado,
            fechaPago: pagado ? today() : '',
            formaPago: pagado ? (formaPago || 'Efectivo') : '',
            observaciones: ''
          });
        }
        const next = { ...db, alquileres };
        setDb(next); saveDB(next);
      };

      const actualizarEnvases = (entregados, devueltos) => {
        const pend = (cliente.envasesEntregados || 0) + entregados - ((cliente.envasesDevueltos || 0) + devueltos);
        const nextCli = { ...cliente, envasesEntregados: (cliente.envasesEntregados || 0) + entregados, envasesDevueltos: (cliente.envasesDevueltos || 0) + devueltos, envasesPendientes: Math.max(0, pend) };
        const next = { ...db, clientes: db.clientes.map(c => c.id === cliente.id ? nextCli : c) };
        setDb(next); saveDB(next);
      };

      return (
        <div className="pb-24">
          <Header title={cliente.nombre} onBack={onBack} right={
            <button onClick={onEdit} className="p-2 rounded-full bg-white/20"><Icon name="edit" size={18} /></button>
          } />
          <div className="px-4 py-4 space-y-4">
            <Card>
              <div className="space-y-2 text-sm">
                {cliente.telefono && <div className="flex items-center gap-2"><Icon name="phone" size={16} className="text-slate-400" /> {cliente.telefono}</div>}
                <div className="flex items-center gap-2"><Icon name="map" size={16} className="text-slate-400" /> {cliente.direccion}</div>
                <div className="text-slate-500">Barrio: {cliente.barrio}</div>
                <div className="text-slate-500">Habitual: {cliente.cantidadHabitual || 0} bidones</div>
                {cliente.observaciones && <div className="text-slate-500 italic">{cliente.observaciones}</div>}
              </div>
            </Card>

            {disp && infoDisp && (
              <Card className="bg-sky-50 border-sky-100">
                <div className="font-semibold text-brand-blue mb-1">Cliente con Dispenser</div>
                <div className="text-sm text-slate-700">N° {disp.dispenserId || '—'} · {formatMoney(disp.precioMensual)}/mes</div>
                <Select label="Mes" value={mesSel} onChange={e => setMesSel(e.target.value)}>
                  {mesesCercanos().map(m => <option key={m} value={m}>{formatMes(m)}</option>)}
                </Select>
                <div className="text-sm mt-1">Incluidos en {formatMes(mesSel)}: <strong>{infoDisp.incluidos}</strong></div>
                <div className="text-sm">Consumidos: <strong>{infoDisp.consumidos}</strong> · Quedan: <strong className={infoDisp.restantes > 0 ? 'text-emerald-600' : 'text-orange-600'}>{infoDisp.restantes}</strong></div>
                <div className="mt-3 pt-3 border-t border-sky-200">
                  <div className="text-sm font-medium mb-2">¿Pagó el alquiler de {formatMes(mesSel)}?</div>
                  <div className="flex gap-2 mb-2">
                    <button onClick={() => marcarPagoMes(true, alqMes?.formaPago || 'Efectivo')}
                      className={`flex-1 py-2 rounded-xl text-sm font-semibold ${(alqMes && alqMes.pagado) ? 'bg-emerald-500 text-white' : 'bg-white border border-slate-200'}`}>
                      Pagó {formatMes(mesSel)}
                    </button>
                    <button onClick={() => marcarPagoMes(false)}
                      className={`flex-1 py-2 rounded-xl text-sm font-semibold ${(!alqMes || !alqMes.pagado) ? 'bg-amber-500 text-white' : 'bg-white border border-slate-200'}`}>
                      No pagó {MESES_ES[Number(mesSel.split('-')[1]) - 1]}
                    </button>
                  </div>
                  {alqMes && alqMes.pagado && (
                    <Select label={`Cómo pagó ${formatMes(mesSel)}`} value={alqMes.formaPago || 'Efectivo'} onChange={e => marcarPagoMes(true, e.target.value)}>
                      <option value="Efectivo">Efectivo</option>
                      <option value="Transferencia">Transferencia</option>
                    </Select>
                  )}
                </div>
              </Card>
            )}

            <div className="grid grid-cols-2 gap-3">
              <Card className="!p-3 text-center">
                <div className={`text-xl font-bold ${(cliente.deuda || 0) > 0 ? 'text-red-500' : 'text-emerald-600'}`}>{formatMoney(cliente.deuda || 0)}</div>
                <div className="text-xs text-slate-500">Deuda</div>
              </Card>
              <Card className="!p-3 text-center">
                <div className="text-xl font-bold text-orange-600">{cliente.envasesPendientes || 0}</div>
                <div className="text-xs text-slate-500">Envases debe</div>
              </Card>
            </div>

            <Card>
              <div className="font-semibold mb-2">Control de envases</div>
              <div className="text-sm text-slate-600 mb-3">
                Entregados: {cliente.envasesEntregados || 0} · Devueltos: {cliente.envasesDevueltos || 0}
              </div>
              <div className="flex gap-2">
                <Button size="sm" variant="outline" className="flex-1" onClick={() => actualizarEnvases(1, 0)}>+1 entregado</Button>
                <Button size="sm" variant="outline" className="flex-1" onClick={() => actualizarEnvases(0, 1)}>+1 devuelto</Button>
              </div>
            </Card>

            <Button variant="orange" className="w-full" onClick={() => onNewPedido(cliente)}>
              <Icon name="plus" size={18} /> Nuevo pedido para este cliente
            </Button>

            <div>
              <h3 className="font-bold text-lg mb-2">Historial</h3>
              {historial.length === 0 ? (
                <p className="text-slate-400 text-sm">Sin pedidos aún</p>
              ) : (
                <div className="space-y-2">
                  {historial.map(p => (
                    <Card key={p.id} className="!p-3">
                      <div className="flex justify-between items-center">
                        <div>
                          <div className="font-medium">{formatDate(p.fecha)} · {p.cantidad} bidones</div>
                          <div className="text-xs text-slate-500">{p.formaPago} {p.transferenciaAcreditada ? '✓' : ''} · {formatMoney(p.cantidad * precio)}</div>
                        </div>
                        <Badge status={p.estado} />
                      </div>
                    </Card>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function NuevoPedidoModal({ db, setDb, onClose, clientePreseleccionado, pedidoEditar }) {
      const [clienteId, setClienteId] = useState(pedidoEditar?.clienteId || clientePreseleccionado?.id || '');
      const [cantidad, setCantidad] = useState(pedidoEditar?.cantidad || clientePreseleccionado?.cantidadHabitual || 2);
      const [formaPago, setFormaPago] = useState(pedidoEditar?.formaPago || 'Efectivo');
      const [estado, setEstado] = useState(pedidoEditar?.estado || 'Pendiente');
      const [acreditada, setAcreditada] = useState(pedidoEditar?.transferenciaAcreditada || false);
      const [obs, setObs] = useState(pedidoEditar?.observaciones || '');
      const [repartidorId, setRepartidorId] = useState(pedidoEditar?.repartidorId || db.repartidores[0]?.id || '');
      const [vehiculoId, setVehiculoId] = useState(pedidoEditar?.vehiculoId || db.vehiculos[0]?.id || '');
      const [fecha, setFecha] = useState(pedidoEditar?.fecha || today());
      const [prioridad, setPrioridad] = useState(pedidoEditar?.prioridad || '');
      const [busqueda, setBusqueda] = useState('');

      useEffect(() => {
        if (pedidoEditar) return;
        const cli = clientePreseleccionado || db.clientes.find(c => c.id === clienteId);
        if (cli && findDispenserForCliente(db, cli)) setFormaPago('Dispenser');
      }, [clienteId, clientePreseleccionado]);

      const clientesFiltrados = useMemo(() => {
        if (!busqueda) return db.clientes.slice(0, 8);
        const t = busqueda.toLowerCase();
        return db.clientes.filter(c => c.nombre.toLowerCase().includes(t) || (c.telefono || '').includes(t)).slice(0, 8);
      }, [db.clientes, busqueda]);

      const clienteSel = db.clientes.find(c => c.id === clienteId);

      // Buscar si el cliente tiene dispenser vinculado
      const dispenserDelCliente = useMemo(() => {
        if (!clienteId && !clienteSel) return null;
        return (db.dispensers || []).find(d => 
          d.clienteId === clienteId || 
          (clienteSel && d.nombre && d.nombre.toLowerCase() === (clienteSel.nombre || '').toLowerCase())
        ) || null;
      }, [db.dispensers, clienteId, clienteSel]);

      // Calcular bidones restantes del mes actual
      const infoDispenserMes = useMemo(() => {
        if (!dispenserDelCliente) return null;
        const mes = (fecha || today()).slice(0, 7);
        const alq = (db.alquileres || []).find(a => a.dispenserClienteId === dispenserDelCliente.id && a.mes === mes);
        const incluidos = alq?.bidonesIncluidos ?? dispenserDelCliente.bidonesIncluidos ?? 10;
        const consumidos = alq?.bidonesConsumidos || 0;
        return {
          incluidos,
          consumidos,
          restantes: Math.max(0, incluidos - consumidos),
          excedente: Math.max(0, consumidos - incluidos),
          mes
        };
      }, [dispenserDelCliente, db.alquileres, fecha]);

      const guardar = () => {
        if (!clienteId || !cantidad) return alert('Seleccioná cliente y cantidad');
        const pedido = {
          id: pedidoEditar?.id || uid(),
          fecha,
          clienteId,
          cantidad: Number(cantidad),
          formaPago,
          estado,
          transferenciaAcreditada: formaPago === 'Transferencia' ? acreditada : false,
          observaciones: obs,
          repartidorId,
          vehiculoId,
          prioridad: prioridad ? Number(prioridad) : (db.pedidos.filter(p => p.fecha === fecha).length + 1),
          precioUnitario: db.precios?.bidon || 2500
        };
        let pedidos;
        if (pedidoEditar) {
          pedidos = db.pedidos.map(p => p.id === pedido.id ? pedido : p);
        } else {
          pedidos = [...db.pedidos, pedido];
        }
        // Actualizar envases si se entrega
        let clientes = db.clientes;
        if (estado === 'Entregado' && (!pedidoEditar || pedidoEditar.estado !== 'Entregado')) {
          clientes = db.clientes.map(c => {
            if (c.id !== clienteId) return c;
            const ent = (c.envasesEntregados || 0) + Number(cantidad);
            const pend = ent - (c.envasesDevueltos || 0);
            return { ...c, envasesEntregados: ent, envasesPendientes: Math.max(0, pend) };
          });
        }

        let alquileres = db.alquileres || [];
        if (formaPago === 'Dispenser' && estado === 'Entregado' && (!pedidoEditar || pedidoEditar.estado !== 'Entregado')) {
          alquileres = aplicarConsumoDispenser({ ...db, clientes, pedidos }, pedido);
        }

        const next = { ...db, pedidos, clientes, alquileres };
        setDb(next); saveDB(next);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center">
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[92vh] overflow-y-auto">
            <div className="sticky top-0 bg-white px-4 py-3 border-b flex justify-between items-center">
              <h2 className="text-lg font-bold">{pedidoEditar ? 'Editar pedido' : 'Nuevo pedido'}</h2>
              <button onClick={onClose} className="p-2"><Icon name="x" size={22} /></button>
            </div>
            <div className="p-4 space-y-1">
              {!clientePreseleccionado && !pedidoEditar && (
                <>
                  <Input label="Buscar cliente" value={busqueda} onChange={e => setBusqueda(e.target.value)} placeholder="Nombre o teléfono" />
                  {busqueda && (
                    <div className="mb-3 max-h-40 overflow-y-auto border rounded-xl">
                      {clientesFiltrados.map(c => (
                        <button key={c.id} onClick={() => {
                            setClienteId(c.id); setBusqueda(''); setCantidad(c.cantidadHabitual || 2);
                            const d = findDispenserForCliente(db, c);
                            if (d && !pedidoEditar) setFormaPago('Dispenser');
                          }}
                          className={`w-full text-left px-3 py-2 border-b last:border-0 ${clienteId === c.id ? 'bg-sky-50' : ''}`}>
                          <div className="font-medium">{c.nombre} {findDispenserForCliente(db, c) ? '· Dispenser' : ''}</div>
                          <div className="text-xs text-slate-500">{c.barrio}</div>
                        </button>
                      ))}
                    </div>
                  )}
                </>
              )}
              {clienteSel && (
                <div className="bg-sky-50 rounded-xl p-3 mb-3">
                  <div className="font-bold">{clienteSel.nombre} {dispenserDelCliente ? '· Dispenser' : ''}</div>
                  <div className="text-sm text-slate-600">{clienteSel.direccion} · {clienteSel.barrio}</div>
                  {dispenserDelCliente && infoDispenserMes && (
                    <div className="text-sm text-brand-blue mt-1">
                      Incluidos {infoDispenserMes.incluidos} · Quedan {infoDispenserMes.restantes} este mes
                    </div>
                  )}
                </div>
              )}
              <Input label="Fecha" type="date" value={fecha} onChange={e => setFecha(e.target.value)} />
              <Input label="Cantidad de bidones" type="number" min="1" value={cantidad} onChange={e => setCantidad(e.target.value)} />
              <Select label="Forma de pago" value={formaPago} onChange={e => setFormaPago(e.target.value)}>
                <option value="Efectivo">Efectivo</option>
                <option value="Transferencia">Transferencia</option>
                <option value="Dispenser">Dispenser</option>
              </Select>
              {formaPago === 'Transferencia' && (
                <label className="flex items-center gap-3 mb-3 p-3 bg-amber-50 rounded-xl">
                  <input type="checkbox" checked={acreditada} onChange={e => setAcreditada(e.target.checked)} className="w-5 h-5 rounded" />
                  <span className="font-medium">Transferencia acreditada</span>
                </label>
              )}
              {formaPago === 'Dispenser' && (
                <div className="mb-3 p-3 bg-sky-50 rounded-xl text-sm text-sky-800">
                  {dispenserDelCliente && infoDispenserMes ? (
                    <>Se descuentan {cantidad || 0} bidones de los {infoDispenserMes.incluidos} incluidos. Quedan {Math.max(0, infoDispenserMes.restantes - Number(cantidad || 0))} después de este pedido.</>
                  ) : (
                    <>Este cliente no está vinculado a un dispenser. Vinculalo en la pestaña Dispensers para descontar automáticamente.</>
                  )}
                </div>
              )}
              <Select label="Estado" value={estado} onChange={e => setEstado(e.target.value)}>
                <option>Pendiente</option>
                <option>En reparto</option>
                <option>Entregado</option>
                <option>Cancelado</option>
              </Select>
              <Select label="Repartidor" value={repartidorId} onChange={e => setRepartidorId(e.target.value)}>
                {db.repartidores.map(r => <option key={r.id} value={r.id}>{r.nombre}</option>)}
              </Select>
              <Select label="Vehículo" value={vehiculoId} onChange={e => setVehiculoId(e.target.value)}>
                {db.vehiculos.map(v => <option key={v.id} value={v.id}>{v.marca} {v.modelo} ({v.patente})</option>)}
              </Select>
              <Textarea label="Observaciones" value={obs} onChange={e => setObs(e.target.value)} />
              <Button className="w-full mt-2" onClick={guardar}>{pedidoEditar ? 'Guardar cambios' : 'Crear pedido'}</Button>
            </div>
          </div>
        </div>
      );
    }

    function NuevoClienteModal({ db, setDb, onClose, clienteEditar }) {
      const [form, setForm] = useState(clienteEditar || {
        nombre: '', telefono: '', direccion: '', barrio: '', cantidadHabitual: 2, observaciones: '', deuda: 0,
        envasesEntregados: 0, envasesDevueltos: 0, envasesPendientes: 0
      });
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const guardar = () => {
        if (!form.nombre.trim()) return alert('Nombre obligatorio');
        const cli = { ...form, id: clienteEditar?.id || uid(), envasesPendientes: Math.max(0, (form.envasesEntregados || 0) - (form.envasesDevueltos || 0)) };
        let clientes;
        if (clienteEditar) {
          clientes = db.clientes.map(c => c.id === cli.id ? cli : c);
        } else {
          clientes = [...db.clientes, cli];
        }
        const next = { ...db, clientes };
        setDb(next); saveDB(next);
        onClose(cli);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center">
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[92vh] overflow-y-auto">
            <div className="sticky top-0 bg-white px-4 py-3 border-b flex justify-between items-center">
              <h2 className="text-lg font-bold">{clienteEditar ? 'Editar cliente' : 'Nuevo cliente'}</h2>
              <button onClick={() => onClose()} className="p-2"><Icon name="x" size={22} /></button>
            </div>
            <div className="p-4">
              <Input label="Nombre y apellido *" value={form.nombre} onChange={e => set('nombre', e.target.value)} />
              <Input label="Teléfono" value={form.telefono} onChange={e => set('telefono', e.target.value)} type="tel" />
              <Input label="Dirección" value={form.direccion} onChange={e => set('direccion', e.target.value)} />
              <Input label="Barrio" value={form.barrio} onChange={e => set('barrio', e.target.value)} />
              <Input label="Cantidad habitual de bidones" type="number" value={form.cantidadHabitual} onChange={e => set('cantidadHabitual', e.target.value)} />
              <Input label="Deuda actual ($)" type="number" value={form.deuda} onChange={e => set('deuda', e.target.value)} />
              <Textarea label="Observaciones" value={form.observaciones} onChange={e => set('observaciones', e.target.value)} />
              <Button className="w-full" onClick={guardar}>Guardar cliente</Button>
            </div>
          </div>
        </div>
      );
    }

    function DispensersScreen({ db, setDb }) {
      const [selected, setSelected] = useState(null);
      const [showNew, setShowNew] = useState(false);
      const [editingDisp, setEditingDisp] = useState(null);
      const [editingAlq, setEditingAlq] = useState(null);
      const [form, setForm] = useState({ nombre: '', telefono: '', direccion: '', barrio: '', dispenserId: '', fechaInicio: today(), precioMensual: db.precios?.alquilerBase || 15000, bidonesIncluidos: 10, estado: 'Activo', clienteId: '' });

      const resetForm = () => setForm({ nombre: '', telefono: '', direccion: '', barrio: '', dispenserId: '', fechaInicio: today(), precioMensual: db.precios?.alquilerBase || 15000, bidonesIncluidos: 10, estado: 'Activo', clienteId: '' });

      const guardarDispenser = () => {
        if (!form.nombre) return alert('Nombre obligatorio');
        let clientes = [...db.clientes];
        let clienteId = form.clienteId;
        if (!clienteId) {
          const existente = clientes.find(c => (c.nombre || '').toLowerCase() === form.nombre.toLowerCase());
          if (existente) {
            clienteId = existente.id;
          } else {
            const nuevoCli = {
              id: uid(),
              nombre: form.nombre,
              telefono: form.telefono || '',
              direccion: form.direccion || '',
              barrio: form.barrio || '',
              cantidadHabitual: form.bidonesIncluidos || 10,
              observaciones: 'Cliente con dispenser',
              deuda: 0,
              envasesEntregados: 0,
              envasesDevueltos: 0,
              envasesPendientes: 0
            };
            clientes = [...clientes, nuevoCli];
            clienteId = nuevoCli.id;
          }
        }
        const dataDisp = { ...form, clienteId };
        let dispensers;
        const idDisp = editingDisp?.id || uid();
        if (editingDisp) {
          dispensers = db.dispensers.map(d => d.id === editingDisp.id ? { ...dataDisp, id: editingDisp.id } : d);
        } else {
          dispensers = [...db.dispensers, { ...dataDisp, id: idDisp }];
        }
        const next = { ...db, dispensers, clientes };
        setDb(next); saveDB(next);
        setShowNew(false);
        setEditingDisp(null);
        resetForm();
        if (selected && editingDisp && selected.id === editingDisp.id) {
          setSelected({ ...dataDisp, id: editingDisp.id });
        }
      };

      const eliminarDispenser = (id) => {
        if (!confirm('¿Eliminar este cliente con dispenser? Se borrarán también sus registros mensuales.')) return;
        const next = {
          ...db,
          dispensers: db.dispensers.filter(d => d.id !== id),
          alquileres: (db.alquileres || []).filter(a => a.dispenserClienteId !== id)
        };
        setDb(next); saveDB(next);
        setSelected(null);
      };

      const guardarAlquiler = () => {
        if (!editingAlq) return;
        const alquileres = (db.alquileres || []).map(a => a.id === editingAlq.id ? editingAlq : a);
        const next = { ...db, alquileres };
        setDb(next); saveDB(next);
        setEditingAlq(null);
      };

      const crearMes = () => {
        const mes = new Date().toISOString().slice(0, 7);
        const existe = (db.alquileres || []).some(a => a.dispenserClienteId === selected.id && a.mes === mes);
        if (existe) return alert('Ya existe un registro para este mes');
        const alq = {
          id: uid(),
          dispenserClienteId: selected.id,
          mes,
          monto: selected.precioMensual || 15000,
          bidonesIncluidos: selected.bidonesIncluidos ?? 10,
          bidonesConsumidos: 0,
          pagado: false,
          fechaPago: '',
          formaPago: '',
          observaciones: ''
        };
        const next = { ...db, alquileres: [...(db.alquileres || []), alq] };
        setDb(next); saveDB(next);
      };

      // ========== DETALLE DE UN DISPENSER ==========
      if (selected) {
        const alquileres = (db.alquileres || []).filter(a => a.dispenserClienteId === selected.id).sort((a, b) => b.mes.localeCompare(a.mes));
        const totalConsumo = alquileres.reduce((s, a) => s + (a.bidonesConsumidos || 0), 0);
        const promedio = alquileres.length ? Math.round(totalConsumo / alquileres.length) : 0;

        return (
          <div className="pb-24">
            <Header title={selected.nombre} onBack={() => setSelected(null)} right={
              <button onClick={() => { setEditingDisp(selected); setForm(selected); setShowNew(true); }} className="p-2 rounded-full bg-white/20">
                <Icon name="edit" size={18} />
              </button>
            } />
            <div className="px-4 py-4 space-y-4">
              <Card>
                <div className="text-sm space-y-1.5">
                  <div><span className="text-slate-500">Dispenser:</span> <strong>{selected.dispenserId || '—'}</strong></div>
                  <div><span className="text-slate-500">Inicio:</span> {formatDate(selected.fechaInicio)}</div>
                  <div><span className="text-slate-500">Alquiler mensual:</span> <strong>{formatMoney(selected.precioMensual)}</strong></div>
                  <div><span className="text-slate-500">Bidones incluidos/mes:</span> <strong className="text-brand-blue">{selected.bidonesIncluidos ?? 10}</strong></div>
                  <div><span className="text-slate-500">Estado:</span> <span className={selected.estado === 'Activo' ? 'text-emerald-600 font-medium' : 'text-red-500'}>{selected.estado}</span></div>
                  {selected.telefono && <div><span className="text-slate-500">Tel:</span> {selected.telefono}</div>}
                  {selected.direccion && <div><span className="text-slate-500">Dir:</span> {selected.direccion}</div>}
                  {selected.barrio && <div><span className="text-slate-500">Barrio:</span> {selected.barrio}</div>}
                </div>
              </Card>

              <div className="grid grid-cols-2 gap-3">
                <Card className="!p-3 text-center">
                  <div className="text-xl font-bold text-brand-blue">{totalConsumo}</div>
                  <div className="text-xs text-slate-500">Total bidones</div>
                </Card>
                <Card className="!p-3 text-center">
                  <div className="text-xl font-bold text-brand-orange">{promedio}</div>
                  <div className="text-xs text-slate-500">Promedio/mes</div>
                </Card>
              </div>

              <div className="flex justify-between items-center">
                <h3 className="font-bold text-lg">Historial mensual</h3>
                <Button size="sm" variant="outline" onClick={crearMes}>+ Mes</Button>
              </div>

              {alquileres.length === 0 ? (
                <p className="text-slate-400 text-sm text-center py-6">Sin registros mensuales aún</p>
              ) : (
                <div className="space-y-2">
                  {alquileres.map(a => {
                    const incluidos = a.bidonesIncluidos ?? selected.bidonesIncluidos ?? 10;
                    const consumidos = a.bidonesConsumidos || 0;
                    const restantes = Math.max(0, incluidos - consumidos);
                    const excedente = Math.max(0, consumidos - incluidos);
                    return (
                      <Card key={a.id} className="!p-3" onClick={() => setEditingAlq({ ...a, bidonesIncluidos: incluidos })}>
                        <div className="flex justify-between items-start">
                          <div>
                            <div className="font-semibold">{formatMes(a.mes)}</div>
                            <div className="text-sm text-slate-600 mt-0.5">
                              Consumidos: <strong>{consumidos}</strong> / {incluidos} incluidos
                            </div>
                            <div className="text-xs mt-0.5">
                              {restantes > 0 ? (
                                <span className="text-emerald-600">Quedan {restantes} incluidos</span>
                              ) : (
                                <span className="text-orange-600">Incluidos agotados {excedente > 0 ? `(+${excedente} extra)` : ''}</span>
                              )}
                            </div>
                            {a.formaPago && <div className="text-xs text-slate-500 mt-0.5">Pago: {a.formaPago}</div>}
                            {a.observaciones && <div className="text-xs text-slate-400 italic mt-0.5">{a.observaciones}</div>}
                          </div>
                          <div className="text-right">
                            <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${a.pagado ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                              {a.pagado ? '✓ Pagado' : 'Pendiente'}
                            </span>
                            {a.fechaPago && <div className="text-xs text-slate-400 mt-1">{formatDate(a.fechaPago)}</div>}
                          </div>
                        </div>
                      </Card>
                    );
                  })}
                </div>
              )}

              <Button variant="danger" className="w-full" onClick={() => eliminarDispenser(selected.id)}>
                Eliminar cliente dispenser
              </Button>
            </div>

            {/* Modal editar alquiler mensual */}
            {editingAlq && (
              <div className="fixed inset-0 z-50 bg-black/50 flex items-end justify-center">
                <div className="bg-white w-full max-w-lg rounded-t-3xl p-4 max-h-[90vh] overflow-y-auto">
                  <div className="flex justify-between mb-4">
                    <h2 className="text-lg font-bold">Editar {formatMes(editingAlq.mes)}</h2>
                    <button onClick={() => setEditingAlq(null)}><Icon name="x" size={22} /></button>
                  </div>
                  <Input label="Mes (YYYY-MM)" value={editingAlq.mes} onChange={e => setEditingAlq({...editingAlq, mes: e.target.value})} />
                  <Input label="Monto alquiler ($)" type="number" value={editingAlq.monto} onChange={e => setEditingAlq({...editingAlq, monto: Number(e.target.value)})} />
                  <Input label="Bidones incluidos este mes" type="number" value={editingAlq.bidonesIncluidos ?? 10} onChange={e => setEditingAlq({...editingAlq, bidonesIncluidos: Number(e.target.value)})} />
                  <Input label="Bidones consumidos" type="number" value={editingAlq.bidonesConsumidos} onChange={e => setEditingAlq({...editingAlq, bidonesConsumidos: Number(e.target.value)})} />
                  
                  <div className="mb-3">
                    <label className="block text-sm font-medium text-slate-600 mb-1">¿Pagado?</label>
                    <div className="flex gap-2">
                      <button onClick={() => setEditingAlq({...editingAlq, pagado: true})}
                        className={`flex-1 py-3 rounded-xl font-semibold ${editingAlq.pagado ? 'bg-emerald-500 text-white' : 'bg-slate-100'}`}>
                        Sí, pagado
                      </button>
                      <button onClick={() => setEditingAlq({...editingAlq, pagado: false, fechaPago: '', formaPago: ''})}
                        className={`flex-1 py-3 rounded-xl font-semibold ${!editingAlq.pagado ? 'bg-amber-500 text-white' : 'bg-slate-100'}`}>
                        No pagado
                      </button>
                    </div>
                  </div>

                  {editingAlq.pagado && (
                    <>
                      <Input label="Fecha de pago" type="date" value={editingAlq.fechaPago || ''} onChange={e => setEditingAlq({...editingAlq, fechaPago: e.target.value})} />
                      <Select label="Forma de pago" value={editingAlq.formaPago || ''} onChange={e => setEditingAlq({...editingAlq, formaPago: e.target.value})}>
                        <option value="">Seleccionar...</option>
                        <option value="Efectivo">Efectivo</option>
                        <option value="Transferencia">Transferencia</option>
                      </Select>
                    </>
                  )}

                  <Textarea label="Observaciones / Correcciones" value={editingAlq.observaciones || ''} onChange={e => setEditingAlq({...editingAlq, observaciones: e.target.value})} />
                  
                  <div className="flex gap-2 mt-2">
                    <Button variant="ghost" className="flex-1" onClick={() => setEditingAlq(null)}>Cancelar</Button>
                    <Button className="flex-1" onClick={guardarAlquiler}>Guardar cambios</Button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ========== LISTA DE DISPENSER ==========
      return (
        <div className="pb-24">
          <Header title="Clientes con Dispenser" right={
            <button onClick={() => { resetForm(); setEditingDisp(null); setShowNew(true); }} className="p-2 rounded-full bg-white/20">
              <Icon name="plus" size={20} />
            </button>
          } />
          <div className="px-4 py-3 space-y-2">
            {db.dispensers.length === 0 ? (
              <div className="text-center py-12 text-slate-400">
                <Icon name="droplet" size={48} className="mx-auto mb-3 opacity-40" />
                <p>No hay clientes con dispenser</p>
                <Button className="mt-4" onClick={() => setShowNew(true)}>Agregar el primero</Button>
              </div>
            ) : db.dispensers.map(d => {
              const alqs = (db.alquileres || []).filter(a => a.dispenserClienteId === d.id);
              const pendientes = alqs.filter(a => !a.pagado).length;
              return (
                <Card key={d.id} onClick={() => setSelected(d)}>
                  <div className="flex justify-between items-start">
                    <div>
                      <div className="font-bold">{d.nombre}</div>
                      <div className="text-sm text-slate-500">{d.barrio || d.direccion} · {formatMoney(d.precioMensual)}/mes</div>
                      <div className="text-xs text-brand-blue mt-0.5">{d.bidonesIncluidos ?? 10} bidones incluidos/mes</div>
                      {d.dispenserId && <div className="text-xs text-slate-400">N° {d.dispenserId}</div>}
                    </div>
                    <div className="text-right">
                      <span className={`text-xs font-medium ${d.estado === 'Activo' ? 'text-emerald-600' : 'text-red-500'}`}>{d.estado}</span>
                      {pendientes > 0 && <div className="text-xs text-amber-600 mt-1">{pendientes} mes(es) pendiente</div>}
                    </div>
                  </div>
                </Card>
              );
            })}
          </div>

          {/* Modal nuevo / editar dispenser */}
          {showNew && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-end justify-center">
              <div className="bg-white w-full max-w-lg rounded-t-3xl p-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between mb-4">
                  <h2 className="text-lg font-bold">{editingDisp ? 'Editar dispenser' : 'Nuevo cliente dispenser'}</h2>
                  <button onClick={() => { setShowNew(false); setEditingDisp(null); }}><Icon name="x" size={22} /></button>
                </div>
                <Input label="Nombre *" value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} />
                <Input label="Teléfono" value={form.telefono} onChange={e => setForm({...form, telefono: e.target.value})} />
                <Input label="Dirección" value={form.direccion} onChange={e => setForm({...form, direccion: e.target.value})} />
                <Input label="Barrio" value={form.barrio} onChange={e => setForm({...form, barrio: e.target.value})} />
                <Input label="ID / N° Dispenser" value={form.dispenserId} onChange={e => setForm({...form, dispenserId: e.target.value})} />
                <Input label="Fecha inicio" type="date" value={form.fechaInicio} onChange={e => setForm({...form, fechaInicio: e.target.value})} />
                <Input label="Precio alquiler mensual ($)" type="number" value={form.precioMensual} onChange={e => setForm({...form, precioMensual: e.target.value})} />
                <Input label="Bidones incluidos por mes" type="number" min="0" value={form.bidonesIncluidos} onChange={e => setForm({...form, bidonesIncluidos: Number(e.target.value)})} />
                <p className="text-xs text-slate-500 -mt-2 mb-3">Ej: 10, 15 o 20. Estos se descuentan automáticamente cuando entregás pedidos con pago “Dispenser”.</p>
                <Select label="Estado" value={form.estado} onChange={e => setForm({...form, estado: e.target.value})}>
                  <option value="Activo">Activo</option>
                  <option value="Inactivo">Inactivo</option>
                  <option value="Retirado">Retirado</option>
                </Select>
                <Select label="Vincular a cliente existente (opcional)" value={form.clienteId || ''} onChange={e => setForm({...form, clienteId: e.target.value})}>
                  <option value="">— Sin vincular —</option>
                  {db.clientes.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                </Select>
                <p className="text-xs text-slate-400 mb-3">Si lo vinculás, los pedidos con pago “Dispenser” de ese cliente se suman automáticamente al consumo del mes.</p>
                <Button className="w-full" onClick={guardarDispenser}>{editingDisp ? 'Guardar cambios' : 'Crear dispenser'}</Button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function MasScreen({ db, setDb }) {
      const [section, setSection] = useState(null);

      if (section === 'repartidores') {
        return (
          <div className="pb-24">
            <Header title="Repartidores" onBack={() => setSection(null)} />
            <div className="px-4 py-3 space-y-2">
              {db.repartidores.map(r => (
                <Card key={r.id}>
                  <div className="font-bold">{r.nombre}</div>
                  <div className="text-sm text-slate-500">{r.telefono || 'Sin teléfono'}</div>
                </Card>
              ))}
              <Button className="w-full mt-4" onClick={() => {
                const nombre = prompt('Nombre del repartidor');
                if (!nombre) return;
                const r = { id: uid(), nombre, telefono: '', foto: '', vehiculoId: '' };
                const next = { ...db, repartidores: [...db.repartidores, r] };
                setDb(next); saveDB(next);
              }}>+ Agregar repartidor</Button>
            </div>
          </div>
        );
      }
      if (section === 'vehiculos') {
        return (
          <div className="pb-24">
            <Header title="Vehículos" onBack={() => setSection(null)} />
            <div className="px-4 py-3 space-y-2">
              {db.vehiculos.map(v => (
                <Card key={v.id}>
                  <div className="font-bold">{v.marca} {v.modelo}</div>
                  <div className="text-sm text-slate-500">{v.patente} · {v.anio} · {v.estado}</div>
                </Card>
              ))}
              <Button className="w-full mt-4" onClick={() => {
                const marca = prompt('Marca');
                const modelo = prompt('Modelo');
                const patente = prompt('Patente');
                if (!marca || !patente) return;
                const v = { id: uid(), marca, modelo: modelo || '', patente, anio: new Date().getFullYear(), tipo: 'Utilitario', repartidorHabitualId: '', estado: 'Activo' };
                const next = { ...db, vehiculos: [...db.vehiculos, v] };
                setDb(next); saveDB(next);
              }}>+ Agregar vehículo</Button>
            </div>
          </div>
        );
      }
      if (section === 'precios') {
        return (
          <div className="pb-24">
            <Header title="Precios" onBack={() => setSection(null)} />
            <div className="px-4 py-4">
              <Input label="Precio por bidón ($)" type="number" value={db.precios?.bidon || 2500}
                onChange={e => {
                  const next = { ...db, precios: { ...db.precios, bidon: Number(e.target.value) } };
                  setDb(next); saveDB(next);
                }} />
              <Input label="Alquiler base dispenser ($)" type="number" value={db.precios?.alquilerBase || 15000}
                onChange={e => {
                  const next = { ...db, precios: { ...db.precios, alquilerBase: Number(e.target.value) } };
                  setDb(next); saveDB(next);
                }} />
            </div>
          </div>
        );
      }

      return (
        <div className="pb-24">
          <Header title="Más opciones" />
          <div className="px-4 py-3 space-y-2">
            <Card onClick={() => setSection('repartidores')} className="flex items-center gap-3">
              <Icon name="users" size={22} className="text-brand-blue" />
              <span className="font-medium">Repartidores</span>
            </Card>
            <Card onClick={() => setSection('vehiculos')} className="flex items-center gap-3">
              <Icon name="truck" size={22} className="text-brand-blue" />
              <span className="font-medium">Vehículos</span>
            </Card>
            <Card onClick={() => setSection('precios')} className="flex items-center gap-3">
              <Icon name="dollar" size={22} className="text-brand-blue" />
              <span className="font-medium">Precios</span>
            </Card>
            <Card onClick={() => {
              if (confirm('¿Exportar todos los datos como JSON?')) {
                const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `aguas-del-paso-backup-${today()}.json`;
                a.click();
              }
            }} className="flex items-center gap-3">
              <Icon name="package" size={22} className="text-brand-blue" />
              <span className="font-medium">Exportar backup</span>
            </Card>
            <Card onClick={() => {
              if (confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')) {
                localStorage.removeItem(DB_KEY);
                setDb(structuredClone(defaultData));
              }
            }} className="flex items-center gap-3 text-red-500">
              <Icon name="trash" size={22} />
              <span className="font-medium">Borrar todos los datos</span>
            </Card>
          </div>
        </div>
      );
    }

    // ==================== APP ====================
    function App() {
      const [splash, setSplash] = useState(true);
      const [db, setDb] = useState(loadDB);
      const [tab, setTab] = useState('inicio');
      const [fechaReparto, setFechaReparto] = useState(today());
      const [showNuevoPedido, setShowNuevoPedido] = useState(false);
      const [showNuevoCliente, setShowNuevoCliente] = useState(false);
      const [clienteSeleccionado, setClienteSeleccionado] = useState(null);
      const [clienteParaPedido, setClienteParaPedido] = useState(null);
      const [pedidoEditar, setPedidoEditar] = useState(null);
      const [showSearch, setShowSearch] = useState(false);

      useEffect(() => { saveDB(db); }, [db]);

      if (splash) return <Splash onDone={() => setSplash(false)} />;

      return (
        <div className="min-h-screen max-w-lg mx-auto bg-slate-50 relative">
          {tab === 'inicio' && !clienteSeleccionado && (
            <Dashboard db={db} setTab={setTab}
              onNewPedido={() => { setClienteParaPedido(null); setPedidoEditar(null); setShowNuevoPedido(true); }}
              onSearch={() => setShowSearch(true)} />
          )}
          {tab === 'repartos' && !clienteSeleccionado && (
            <RepartosScreen db={db} setDb={setDb} fecha={fechaReparto} setFecha={setFechaReparto}
              onEditPedido={(p) => { setPedidoEditar(p); setShowNuevoPedido(true); }} />
          )}
          {tab === 'clientes' && !clienteSeleccionado && (
            <ClientesScreen db={db} setDb={setDb}
              onSelectCliente={setClienteSeleccionado}
              onNewCliente={() => setShowNuevoCliente(true)} />
          )}
          {tab === 'dispensers' && !clienteSeleccionado && (
            <DispensersScreen db={db} setDb={setDb} />
          )}
          {tab === 'mas' && !clienteSeleccionado && (
            <MasScreen db={db} setDb={setDb} />
          )}

          {clienteSeleccionado && (
            <ClienteDetail
              cliente={clienteSeleccionado}
              db={db} setDb={setDb}
              onBack={() => setClienteSeleccionado(null)}
              onEdit={() => { setShowNuevoCliente(true); }}
              onNewPedido={(c) => { setClienteParaPedido(c); setPedidoEditar(null); setShowNuevoPedido(true); }}
            />
          )}

          {showNuevoPedido && (
            <NuevoPedidoModal
              db={db} setDb={setDb}
              onClose={() => { setShowNuevoPedido(false); setPedidoEditar(null); setClienteParaPedido(null); }}
              clientePreseleccionado={clienteParaPedido}
              pedidoEditar={pedidoEditar}
            />
          )}
          {showNuevoCliente && (
            <NuevoClienteModal
              db={db} setDb={setDb}
              clienteEditar={clienteSeleccionado}
              onClose={(cli) => {
                setShowNuevoCliente(false);
                if (cli && !clienteSeleccionado) setClienteSeleccionado(cli);
              }}
            />
          )}

          {showSearch && (
            <div className="fixed inset-0 z-50 bg-white">
              <Header title="Buscar cliente" onBack={() => setShowSearch(false)} />
              <div className="p-4">
                <Input autoFocus placeholder="Nombre, teléfono, barrio..." onChange={e => {
                  // simple inline search handled in ClientesScreen style
                }} />
                <p className="text-sm text-slate-400 mt-4">Escribí y seleccioná un cliente de la lista de Clientes, o usá la pestaña Clientes.</p>
                <Button className="w-full mt-4" onClick={() => { setShowSearch(false); setTab('clientes'); }}>Ir a Clientes</Button>
              </div>
            </div>
          )}

          {!clienteSeleccionado && <BottomNav tab={tab} setTab={setTab} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
